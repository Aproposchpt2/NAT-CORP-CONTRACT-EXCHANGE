name: Acquire NevadaEPro

on:
  schedule:
    - cron: '10 14 * * *'   # ~7:10am Pacific daily -- offset from the CA jobs (13:00 and :17 */4h)
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

concurrency:
  group: acquire-nevadaepro
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Acquire NevadaEPro open bids
        run: node scripts/scrape-nevadaepro.js --detail-limit=40
      - name: Commit refreshed NevadaEPro snapshot
        run: |
          git config user.name "pdas-acquisition-bot"
          git config user.email "bot@aproposgroupllc.com"
          git add nevadaepro.json
          git commit -m "data: refresh NevadaEPro acquisition snapshot" || echo "no changes to commit"
          git push
      - name: Synchronize into Supabase and record PDAS acquisition health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDAS_SOURCE_JOB_ID: NV-NEVADAEPRO
        run: node scripts/sync-supabase.js
