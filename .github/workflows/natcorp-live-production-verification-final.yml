name: NAT-CORP Live Production Verification Final

on:
  push:
    branches:
      - fix-natcorp-production-metadata-v1
    paths:
      - .github/workflows/natcorp-live-production-verification-final.yml

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://natcorp.aproposgroupllc.com
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Retrieve live production without cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-verification
          token="$(date +%s)-${GITHUB_SHA}"
          curl -fsSL -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' -D live-verification/live-homepage-headers.txt "$PRODUCTION_URL/?verify=$token" -o live-verification/live-index.html
          : > live-verification/live-link-tests.txt
          for path in / /intake /member-login /dashboard /robots.txt /sitemap.xml /og-natcorp.jpg /headquarters.webp; do
            code=$(curl -LsS -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' "$PRODUCTION_URL$path?verify=$token")
            echo "$code $path" | tee -a live-verification/live-link-tests.txt
            test "$code" = 200
          done
          curl -fsSL -H 'Cache-Control: no-cache' "$PRODUCTION_URL/robots.txt?verify=$token" -o live-verification/robots.txt
          curl -fsSL -H 'Cache-Control: no-cache' "$PRODUCTION_URL/sitemap.xml?verify=$token" -o live-verification/sitemap.xml
          curl -fsSL -H 'Cache-Control: no-cache' "$PRODUCTION_URL/og-natcorp.jpg?verify=$token" -o live-verification/og-natcorp.jpg
      - name: Validate live production source
        shell: bash
        run: |
          python <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from PIL import Image
          import json, re

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=[]; self.in_title=False; self.in_script=False; self.script_type=None; self.script=[]; self.json=[]; self.meta=[]; self.links=[]; self.anchors=[]; self.h1=0; self.text=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  if tag=='h1': self.h1+=1
                  if tag=='meta': self.meta.append(a)
                  if tag=='link': self.links.append(a)
                  if tag=='a': self.anchors.append(a)
                  if tag=='script': self.in_script=True; self.script_type=a.get('type'); self.script=[]
              def handle_endtag(self, tag):
                  if tag=='title': self.in_title=False
                  if tag=='script':
                      if self.script_type=='application/ld+json': self.json.append(''.join(self.script))
                      self.in_script=False; self.script_type=None; self.script=[]
              def handle_data(self, data):
                  if self.in_title: self.title.append(data)
                  if self.in_script: self.script.append(data)
                  else: self.text.append(data)

          raw=Path('live-verification/live-index.html').read_text(encoding='utf-8')
          p=P(); p.feed(raw)
          title=''.join(p.title).strip(); text=re.sub(r'\s+',' ',unescape(' '.join(p.text))).strip()
          names={m.get('name'):m.get('content') for m in p.meta if m.get('name')}
          props={m.get('property'):m.get('content') for m in p.meta if m.get('property')}
          canonical=[x.get('href') for x in p.links if (x.get('rel') or '').lower()=='canonical']
          hrefs=[x.get('href') for x in p.anchors if x.get('href')]

          T='State and Local Government Contract Matching | NAT-CORP'
          D='Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial.'
          C='https://natcorp.aproposgroupllc.com/'
          I='https://natcorp.aproposgroupllc.com/og-natcorp.jpg'
          S='https://buy.stripe.com/dRm8wOcw2d8X3cT7aU7EQ1f'
          R='index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1'

          assert title==T, title
          assert names.get('description')==D
          assert names.get('robots')==R
          assert canonical==[C], canonical
          assert p.h1==1, p.h1
          expected_og={'og:type':'website','og:site_name':'National Corporate Contract Exchange','og:title':T,'og:description':'Licensed contractors receive guided onboarding, personalized public-sector contract matches, intelligent rankings, and Analyze Fit support.','og:url':C,'og:image':I,'og:image:alt':'National Corporate Contract Exchange procurement intelligence platform'}
          assert all(props.get(k)==v for k,v in expected_og.items()), props
          expected_tw={'twitter:card':'summary_large_image','twitter:title':T,'twitter:description':'Guided onboarding, personalized state and local opportunity matching, intelligent rankings, and Analyze Fit support.','twitter:image':I}
          assert all(names.get(k)==v for k,v in expected_tw.items()), names
          assert S in hrefs and '/member-login' in hrefs

          required=['Start your 14-day free trial. Continue for $119 per month.','Additional Analyze Fit Report: $15 one-time','Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.','NAT-CORP currently supports six states, with nationwide expansion underway.','all licensed contractors','Opportunity Builds Business. Business Builds Community.','A Shared Commitment to Economic Opportunity.']
          for value in required: assert value.lower() in text.lower(), value
          for pattern in [r'Free Contract Discovery',r'Build a free business-matched dashboard',r'No subscription required',r'Contract discovery is free',r'Free opportunity matching',r'\$19\.99',r'all 50 states']:
              assert not re.search(pattern,text,re.I), pattern
          assert not re.search(r'Concierge Contract Service.{0,120}\$[0-9]',text,re.I)

          docs=[json.loads(x) for x in p.json]
          graph=next(x['@graph'] for x in docs if isinstance(x,dict) and isinstance(x.get('@graph'),list))
          types={x.get('@type') for x in graph}
          assert {'Organization','WebSite','Service'}<=types
          service=next(x for x in graph if x.get('@type')=='Service'); offer=service['offers']
          assert offer=={'@type':'Offer','name':'NAT-CORP Monthly Membership','price':'119.00','priceCurrency':'USD','availability':'https://schema.org/InStock','description':'Monthly NAT-CORP membership with a 14-day free trial.'}, offer

          robots=Path('live-verification/robots.txt').read_text(encoding='utf-8')
          assert 'User-agent:' in robots and not re.search(r'Disallow:\s*/\s*$',robots,re.M)
          sitemap=Path('live-verification/sitemap.xml').read_text(encoding='utf-8')
          assert C in sitemap
          assert Image.open('live-verification/og-natcorp.jpg').size==(1200,630)

          result={'production_url':C,'title':title,'description':names['description'],'robots_meta':names['robots'],'canonical_count':len(canonical),'canonical':canonical[0],'h1_count':p.h1,'open_graph':expected_og,'twitter':expected_tw,'json_ld_types':sorted(types),'offer':offer,'trial_cta_href':S,'member_login_href':'/member-login','coverage_language':'NAT-CORP currently supports six states, with nationwide expansion underway.','social_image_dimensions':[1200,630],'robots_indexable':True,'routes_verified':['/','/intake','/member-login','/dashboard','/robots.txt','/sitemap.xml','/og-natcorp.jpg','/headquarters.webp'],'validation':'PASS'}
          Path('live-verification/live-validation.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: natcorp-live-production-verification-final
          path: live-verification/
          retention-days: 30
