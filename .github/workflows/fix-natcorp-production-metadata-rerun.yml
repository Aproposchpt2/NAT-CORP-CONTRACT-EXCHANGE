name: NAT-CORP Production Metadata Correction Rerun

on:
  push:
    branches:
      - fix-natcorp-production-metadata-v1
    paths:
      - .github/workflows/fix-natcorp-production-metadata-rerun.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-natcorp-production-metadata-v1
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Correct homepage metadata and commercial language
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json, re
          from PIL import Image, ImageDraw, ImageFont

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<link\s+rel=["\']canonical["\'][^>]*>', '', html, flags=re.I)

          metadata = '''<title>State and Local Government Contract Matching | NAT-CORP</title><meta name="description" content="Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial."><meta name="author" content="Apropos Group LLC"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><meta name="theme-color" content="#0F2A6A"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='1' y='1' width='98' height='98' rx='4' fill='%230F2A6A' stroke='rgba(255,255,255,.25)' stroke-width='1.5'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%23FFFFFF' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"><link rel="canonical" href="https://natcorp.aproposgroupllc.com/"><meta property="og:type" content="website"><meta property="og:site_name" content="National Corporate Contract Exchange"><meta property="og:title" content="State and Local Government Contract Matching | NAT-CORP"><meta property="og:description" content="Licensed contractors receive guided onboarding, personalized public-sector contract matches, intelligent rankings, and Analyze Fit support."><meta property="og:url" content="https://natcorp.aproposgroupllc.com/"><meta property="og:image" content="https://natcorp.aproposgroupllc.com/og-natcorp.jpg"><meta property="og:image:alt" content="National Corporate Contract Exchange procurement intelligence platform"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="State and Local Government Contract Matching | NAT-CORP"><meta name="twitter:description" content="Guided onboarding, personalized state and local opportunity matching, intelligent rankings, and Analyze Fit support."><meta name="twitter:image" content="https://natcorp.aproposgroupllc.com/og-natcorp.jpg"><script type="application/ld+json">{
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Organization",
                "@id": "https://natcorp.aproposgroupllc.com/#organization",
                "name": "National Corporate Contract Exchange",
                "alternateName": "NAT-CORP",
                "url": "https://natcorp.aproposgroupllc.com/",
                "parentOrganization": {
                  "@type": "Organization",
                  "name": "Apropos Group LLC",
                  "url": "https://aproposgroupllc.com/"
                }
              },
              {
                "@type": "WebSite",
                "@id": "https://natcorp.aproposgroupllc.com/#website",
                "url": "https://natcorp.aproposgroupllc.com/",
                "name": "National Corporate Contract Exchange",
                "alternateName": "NAT-CORP",
                "publisher": {"@id": "https://natcorp.aproposgroupllc.com/#organization"}
              },
              {
                "@type": "Service",
                "@id": "https://natcorp.aproposgroupllc.com/#service",
                "name": "State and Local Government Contract Matching",
                "serviceType": "Personalized public-sector procurement opportunity matching for licensed contractors",
                "provider": {"@id": "https://natcorp.aproposgroupllc.com/#organization"},
                "areaServed": {"@type": "Country", "name": "United States"},
                "offers": {
                  "@type": "Offer",
                  "name": "NAT-CORP Monthly Membership",
                  "price": "119.00",
                  "priceCurrency": "USD",
                  "availability": "https://schema.org/InStock",
                  "description": "Monthly NAT-CORP membership with a 14-day free trial."
                }
              }
            ]
          }</script>'''

          html, count = re.subn(r'<title>.*?(?=<link rel="preconnect")', metadata, html, count=1, flags=re.S)
          assert count == 1, f'metadata replacement count: {count}'

          old = '<p>National Corporate Contract Exchange turns public opportunity records into a business-centered decision environment.</p>'
          new = '<p>National Corporate Contract Exchange turns public opportunity records into a business-centered decision environment for all licensed contractors.</p><p><strong>NAT-CORP currently supports six states, with nationwide expansion underway.</strong></p>'
          assert old in html
          html = html.replace(old, new, 1)

          old = '''<section class="section final-cta-section"><div class="container final-cta"><div><div class="eyebrow">Free access</div><h2>Build your government opportunity intelligence dashboard.</h2><p>Begin with your business. Discover what fits.</p><div class="assurances"><span>No subscription</span><span>No payment card</span><span>Fresh personalized assessment</span></div></div><a class="btn primary" href="/intake">Start Free →</a></div></section>'''
          new = '''<section class="section final-cta-section"><div class="container final-cta"><div><div class="eyebrow">NAT-CORP Membership</div><h2>Start your 14-day free trial. Continue for $119 per month.</h2><p>Receive guided onboarding, a personalized opportunity dashboard, intelligent rankings, and public-sector contract matching.</p><div class="assurances"><span>Additional Analyze Fit Report: $15 one-time</span><span>Concierge Contract Service: cost to be determined</span></div><p>Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.</p></div><div class="actions"><a class="btn primary" href="https://buy.stripe.com/dRm8wOcw2d8X3cT7aU7EQ1f">START YOUR 14-DAY FREE TRIAL</a><a class="btn secondary" style="color:#0f2a6a;border-color:#0f2a6a" href="/member-login">MEMBER LOGIN</a></div></div></section>'''
          assert old in html
          html = html.replace(old, new, 1)

          faq = '''<section class="section faq faq-section" id="faq"><div class="container"><h2>Clear answers before you begin.</h2><details><summary>Who can use NAT-CORP?</summary><p>NAT-CORP serves all licensed contractors pursuing applicable state and local public-sector opportunities from supported agencies and institutions.</p></details><details><summary>What does membership cost?</summary><p>Start your 14-day free trial. Continue for $119 per month. The additional Analyze Fit Report is $15 one-time.</p></details><details><summary>What does NAT-CORP cover?</summary><p>NAT-CORP currently supports six states, with nationwide expansion underway. Coverage includes supported state agencies, counties, cities, municipalities, universities, colleges, school districts, hospitals, public authorities, and other supported public institutions.</p></details><details><summary>How is Concierge Contract Service priced?</summary><p>Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.</p></details><details><summary>Does the platform include every contract?</summary><p>No. Coverage varies by supported publisher, source availability, publication practices, and update schedules.</p></details><details><summary>Does a match guarantee eligibility or award?</summary><p>No. Businesses must verify all solicitation requirements on the issuing organization’s official source.</p></details></div></section>'''
          html, count = re.subn(r'<section class="section faq faq-section" id="faq">.*?</section>', faq, html, count=1, flags=re.S)
          assert count == 1, f'FAQ replacement count: {count}'
          html = html.replace('>Member Login<', '>MEMBER LOGIN<').replace('>Start Your 14-Day Free Trial<', '>START YOUR 14-DAY FREE TRIAL<').replace('>Start Your 14-Day Free Trial →<', '>START YOUR 14-DAY FREE TRIAL →<')
          path.write_text(html, encoding='utf-8')

          source = Image.open('headquarters.webp').convert('RGB')
          w, h = 1200, 630
          scale = max(w/source.width, h/source.height)
          resized = source.resize((round(source.width*scale), round(source.height*scale)), Image.Resampling.LANCZOS)
          left, top = (resized.width-w)//2, (resized.height-h)//2
          image = resized.crop((left, top, left+w, top+h)).convert('RGBA')
          overlay = Image.new('RGBA', (w, h), (7,20,47,42)); draw = ImageDraw.Draw(overlay)
          for x in range(w):
              draw.line([(x,0),(x,h)], fill=(7,20,47,int(225*max(0,1-(x/w)/.78))))
          image = Image.alpha_composite(image, overlay); draw = ImageDraw.Draw(image)
          bold = lambda s: ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', s)
          regular = lambda s: ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', s)
          serif = lambda s: ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf', s)
          draw.rounded_rectangle((64,58,140,134), radius=10, fill='white'); draw.text((79,73),'NC',font=bold(32),fill=(15,42,106))
          draw.text((158,62),'NATIONAL CORPORATE',font=bold(18),fill='white'); draw.text((158,89),'CONTRACT EXCHANGE',font=bold(18),fill='white'); draw.text((158,119),'APROPOS GROUP LLC',font=regular(13),fill=(183,199,226))
          draw.multiline_text((64,190),'State and Local\nGovernment Contract\nMatching',font=serif(50),fill='white',spacing=7)
          draw.rectangle((64,400,380,403),fill=(206,169,89)); draw.multiline_text((64,430),'Guided onboarding. Personalized\nopportunity matching. Intelligent rankings.\nAnalyze Fit support.',font=regular(21),fill=(226,234,247),spacing=7)
          draw.rounded_rectangle((64,536,480,588),radius=6,fill='white'); draw.text((84,550),'START YOUR 14-DAY FREE TRIAL',font=bold(17),fill=(15,42,106))
          image.convert('RGB').save('og-natcorp.jpg','JPEG',quality=92,optimize=True,progressive=True)

          html = path.read_text(encoding='utf-8')
          assert html.count('<link rel="canonical" href="https://natcorp.aproposgroupllc.com/">') == 1
          assert len(re.findall(r'<h1(?:\s|>)', html, re.I)) == 1
          data = json.loads(re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S).group(1))
          service = next(x for x in data['@graph'] if x['@type'] == 'Service'); offer = service['offers']
          assert {x['@type'] for x in data['@graph']} == {'Organization','WebSite','Service'}
          assert offer['@type'] == 'Offer' and offer['price'] == '119.00' and offer['priceCurrency'] == 'USD' and offer['availability'] == 'https://schema.org/InStock'
          assert '14-day free trial' in offer['description']
          assert Image.open('og-natcorp.jpg').size == (1200,630)
          assert Path('robots.txt').is_file() and Path('sitemap.xml').is_file()
          required = ['START YOUR 14-DAY FREE TRIAL','MEMBER LOGIN','Additional Analyze Fit Report: $15 one-time','NAT-CORP currently supports six states, with nationwide expansion underway.','Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.']
          assert all(x in html for x in required)
          prohibited = [r'Free Contract Discovery',r'Build a free business-matched dashboard',r'No subscription required',r'Contract discovery is free',r'Free opportunity matching',r'\$19\.99',r'all 50 states']
          assert not any(re.search(x, html, re.I) for x in prohibited)
          print('NAT-CORP correction validation: PASS')
          PY
      - name: Commit validated correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html og-natcorp.jpg
          git commit -m "Correct NAT-CORP production metadata and commercial language"
          git push origin HEAD:fix-natcorp-production-metadata-v1
