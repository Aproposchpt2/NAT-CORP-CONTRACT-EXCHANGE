name: AOIE State Local Tests

# RETIRED 2026-09-10: automatic NAT-CORP/APIE execution halted by owner direction.
# Retained as manual-only for audit/recovery purposes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run state/local AOIE matcher fixtures
        run: node tests/aoie-state-local.test.mjs
      - name: Run state/local AOIE source-contract fixtures
        run: node tests/aoie-state-source.test.mjs
      - name: Run Business Profile Agent fixtures
        run: node tests/business-profile-agent.test.mjs
      - name: Run verified capability-flow fixtures
        run: node --test tests/capability-profile-flow.test.js
      - name: Validate retained Business DNA browser scripts
        run: |
          node --check assets/business-dna-builder-1.js
          node --check assets/business-dna-builder-2.js
          node --check assets/business-dna-builder-3.js
          node --check assets/business-dna-builder-4.js
      - name: Validate AOIE function syntax
        run: node --check netlify/functions/aoie-state-shadow.mjs
      - name: Validate capability profile function syntax
        run: |
          node --check netlify/functions/capability-profile.mjs
          node --check netlify/functions/capability-profile-discover-background.mjs
          node --check netlify/functions/_shared/natcorp-profile-session.mjs
      - name: Validate Analyze Fit function syntax
        run: node --check netlify/functions/analyze-fit-state.mjs
      - name: Validate Business Profile Agent syntax
        run: node --check netlify/functions/business-profile-agent.mjs
      - name: Run verified capability journey and report regressions
        id: regressions
        continue-on-error: true
        run: node tests/analyze-fit-premium.test.mjs > regression-output.txt 2>&1
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-capability-regression-output
          path: regression-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce regression result
        if: steps.regressions.outcome == 'failure'
        run: |
          cat regression-output.txt
          exit 1
