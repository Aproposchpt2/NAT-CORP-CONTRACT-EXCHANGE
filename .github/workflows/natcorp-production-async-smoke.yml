name: Nat-Corp Production Async Smoke

on:
  push:
    branches:
      - hotfix/natcorp-capability-profile-502
    paths:
      - '.github/workflows/natcorp-production-async-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Exercise production async profile build
        shell: bash
        run: |
          set -euo pipefail
          base='https://natcorp.aproposgroupllc.com'
          payload='{"action":"start","contact_name":"Nat-Corp Production Async Smoke","business_name":"Apropos Group LLC","business_email":"natcorp-production-async-smoke@aproposgroupllc.com","website":"https://aproposgroupllc.com","visitor_email":""}'

          page_code=$(curl --max-time 20 --silent --output profile-building.html --write-out '%{http_code}' "${base}/profile-building.html")
          echo "PROFILE_BUILDING_HTTP=${page_code}"
          test "$page_code" = '200'
          grep -q 'Nat-Corp is building' profile-building.html
          grep -q 'Activity Progress' profile-building.html

          start_code=$(curl --max-time 30 --silent --show-error \
            --cookie-jar cookies.txt \
            --header "Origin: ${base}" \
            --header "Referer: ${base}/intake" \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Content-Type: application/json' \
            --output start-body.json \
            --write-out '%{http_code}' \
            --data "$payload" \
            "${base}/api/capability-profile")
          echo "START_HTTP=${start_code}"
          test "$start_code" = '201'

          queue_code=$(curl --max-time 20 --silent --show-error \
            --cookie cookies.txt \
            --header "Origin: ${base}" \
            --header "Referer: ${base}/profile-building.html" \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Content-Type: application/json' \
            --output queue-body.txt \
            --write-out '%{http_code}' \
            --data '{}' \
            "${base}/api/capability-profile-discover")
          echo "QUEUE_HTTP=${queue_code}"
          test "$queue_code" = '202'

          final=''
          for attempt in {1..36}; do
            sleep 5
            poll_code=$(curl --max-time 20 --silent --show-error \
              --cookie cookies.txt \
              --header "Origin: ${base}" \
              --header "Referer: ${base}/profile-building.html" \
              --header 'Sec-Fetch-Site: same-origin' \
              --header 'Accept: application/json' \
              --output poll-body.json \
              --write-out '%{http_code}' \
              "${base}/api/capability-profile")
            test "$poll_code" = '200'
            final=$(jq -r '.session.discovery_status // ""' poll-body.json)
            activity=$(jq -r '.session.draft_profile.activity.stage // ""' poll-body.json)
            percent=$(jq -r '.session.draft_profile.activity.percent // ""' poll-body.json)
            echo "POLL_${attempt}=${final} ACTIVITY=${activity} PERCENT=${percent}"
            if [ "$final" = 'review_ready' ]; then break; fi
            if [ "$final" = 'failed' ]; then cat poll-body.json; exit 1; fi
          done
          test "$final" = 'review_ready'
          echo 'PRODUCTION_ASYNC_DISCOVERY_PASS'
