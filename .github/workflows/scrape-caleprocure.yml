name: Acquire Cal eProcure

# RETIRED 2026-09-10: automatic NAT-CORP/APIE acquisition halted by owner direction.
# Retained as manual-only for audit/recovery purposes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acquire-caleprocure
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare checked-in verified snapshot
        run: node scripts/prepare-caleprocure-snapshot.js
      - name: Resolve agency Business Units in verified snapshot
        run: node scripts/resolve-caleprocure-business-units.js
      - name: Immediately synchronize verified snapshot into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDAS_SOURCE_JOB_ID: CA-CALEPROCURE
        run: node scripts/sync-supabase-grouped.js
      - run: npx playwright install --with-deps chromium
      - name: Acquire statewide Posted events and event packages
        run: node scripts/scrape-caleprocure.js --detail-limit=160 --package-limit=40 --refresh-hours=24
      - name: Resolve agency Business Units in refreshed snapshot
        run: node scripts/resolve-caleprocure-business-units.js
      - name: Commit refreshed Cal eProcure source snapshot
        run: |
          git config user.name "pdas-acquisition-bot"
          git config user.email "bot@aproposgroupllc.com"
          git add caleprocure.json
          git commit -m "data: refresh Cal eProcure acquisition snapshot" || echo "no changes to commit"
          git push
      - name: Synchronize refreshed verified records into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDAS_SOURCE_JOB_ID: CA-CALEPROCURE
        run: node scripts/sync-supabase-grouped.js

