name: NAT-CORP Production Metadata Correction

on:
  push:
    branches:
      - fix-natcorp-production-metadata-v1
    paths:
      - .github/workflows/fix-natcorp-production-metadata.yml

permissions:
  contents: write

jobs:
  correct-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-natcorp-production-metadata-v1

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply surgical metadata and commercial corrections
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          metadata = '''<title>State and Local Government Contract Matching | NAT-CORP</title><meta name="description" content="Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial."><meta name="author" content="Apropos Group LLC"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><meta name="theme-color" content="#0F2A6A"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='1' y='1' width='98' height='98' rx='4' fill='%230F2A6A' stroke='rgba(255,255,255,.25)' stroke-width='1.5'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%23FFFFFF' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E"><link rel="canonical" href="https://natcorp.aproposgroupllc.com/"><meta property="og:type" content="website"><meta property="og:site_name" content="National Corporate Contract Exchange"><meta property="og:title" content="State and Local Government Contract Matching | NAT-CORP"><meta property="og:description" content="Licensed contractors receive guided onboarding, personalized public-sector contract matches, intelligent rankings, and Analyze Fit support."><meta property="og:url" content="https://natcorp.aproposgroupllc.com/"><meta property="og:image" content="https://natcorp.aproposgroupllc.com/og-natcorp.jpg"><meta property="og:image:alt" content="National Corporate Contract Exchange procurement intelligence platform"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="State and Local Government Contract Matching | NAT-CORP"><meta name="twitter:description" content="Guided onboarding, personalized state and local opportunity matching, intelligent rankings, and Analyze Fit support."><meta name="twitter:image" content="https://natcorp.aproposgroupllc.com/og-natcorp.jpg"><script type="application/ld+json">{
            "@context": "https://schema.org",
            "@graph": [
              {
                "@type": "Organization",
                "@id": "https://natcorp.aproposgroupllc.com/#organization",
                "name": "National Corporate Contract Exchange",
                "alternateName": "NAT-CORP",
                "url": "https://natcorp.aproposgroupllc.com/",
                "parentOrganization": {
                  "@type": "Organization",
                  "name": "Apropos Group LLC",
                  "url": "https://aproposgroupllc.com/"
                }
              },
              {
                "@type": "WebSite",
                "@id": "https://natcorp.aproposgroupllc.com/#website",
                "url": "https://natcorp.aproposgroupllc.com/",
                "name": "National Corporate Contract Exchange",
                "alternateName": "NAT-CORP",
                "publisher": {
                  "@id": "https://natcorp.aproposgroupllc.com/#organization"
                }
              },
              {
                "@type": "Service",
                "@id": "https://natcorp.aproposgroupllc.com/#service",
                "name": "State and Local Government Contract Matching",
                "serviceType": "Personalized public-sector procurement opportunity matching for licensed contractors",
                "provider": {
                  "@id": "https://natcorp.aproposgroupllc.com/#organization"
                },
                "areaServed": {
                  "@type": "Country",
                  "name": "United States"
                },
                "offers": {
                  "@type": "Offer",
                  "name": "NAT-CORP Monthly Membership",
                  "price": "119.00",
                  "priceCurrency": "USD",
                  "availability": "https://schema.org/InStock",
                  "description": "Monthly NAT-CORP membership with a 14-day free trial."
                }
              }
            ]
          }</script>'''

          html, replacements = re.subn(
              r'<title>.*?(?=<link rel="preconnect")',
              metadata,
              html,
              count=1,
              flags=re.S,
          )
          if replacements != 1:
              raise SystemExit(f'Expected one metadata block replacement, found {replacements}.')

          current_showcase = '<p>National Corporate Contract Exchange turns public opportunity records into a business-centered decision environment.</p>'
          corrected_showcase = '<p>National Corporate Contract Exchange turns public opportunity records into a business-centered decision environment for all licensed contractors.</p><p><strong>NAT-CORP currently supports six states, with nationwide expansion underway.</strong></p>'
          if current_showcase not in html:
              raise SystemExit('Showcase source paragraph was not found.')
          html = html.replace(current_showcase, corrected_showcase, 1)

          current_cta = '''<section class="section final-cta-section"><div class="container final-cta"><div><div class="eyebrow">Free access</div><h2>Build your government opportunity intelligence dashboard.</h2><p>Begin with your business. Discover what fits.</p><div class="assurances"><span>No subscription</span><span>No payment card</span><span>Fresh personalized assessment</span></div></div><a class="btn primary" href="/intake">Start Free →</a></div></section>'''
          corrected_cta = '''<section class="section final-cta-section"><div class="container final-cta"><div><div class="eyebrow">NAT-CORP Membership</div><h2>Start your 14-day free trial. Continue for $119 per month.</h2><p>Receive guided onboarding, a personalized opportunity dashboard, intelligent rankings, and public-sector contract matching.</p><div class="assurances"><span>Additional Analyze Fit Report: $15 one-time</span><span>Concierge Contract Service: cost to be determined</span></div><p>Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.</p></div><div class="actions"><a class="btn primary" href="https://buy.stripe.com/dRm8wOcw2d8X3cT7aU7EQ1f">START YOUR 14-DAY FREE TRIAL</a><a class="btn secondary" style="color:#0f2a6a;border-color:#0f2a6a" href="/member-login">MEMBER LOGIN</a></div></div></section>'''
          if current_cta not in html:
              raise SystemExit('Current final CTA section was not found.')
          html = html.replace(current_cta, corrected_cta, 1)

          corrected_faq = '''<section class="section faq faq-section" id="faq"><div class="container"><h2>Clear answers before you begin.</h2><details><summary>Who can use NAT-CORP?</summary><p>NAT-CORP serves all licensed contractors pursuing applicable state and local public-sector opportunities from supported agencies and institutions.</p></details><details><summary>What does membership cost?</summary><p>Start your 14-day free trial. Continue for $119 per month. The additional Analyze Fit Report is $15 one-time.</p></details><details><summary>What does NAT-CORP cover?</summary><p>NAT-CORP currently supports six states, with nationwide expansion underway. Coverage includes supported state agencies, counties, cities, municipalities, universities, colleges, school districts, hospitals, public authorities, and other supported public institutions.</p></details><details><summary>How is Concierge Contract Service priced?</summary><p>Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.</p></details><details><summary>Does the platform include every contract?</summary><p>No. Coverage varies by supported publisher, source availability, publication practices, and update schedules.</p></details><details><summary>Does a match guarantee eligibility or award?</summary><p>No. Businesses must verify all solicitation requirements on the issuing organization’s official source.</p></details></div></section>'''
          html, faq_replacements = re.subn(
              r'<section class="section faq faq-section" id="faq">.*?</section>',
              corrected_faq,
              html,
              count=1,
              flags=re.S,
          )
          if faq_replacements != 1:
              raise SystemExit(f'Expected one FAQ replacement, found {faq_replacements}.')

          html = html.replace('>Member Login<', '>MEMBER LOGIN<')
          html = html.replace('>Start Your 14-Day Free Trial<', '>START YOUR 14-DAY FREE TRIAL<')
          html = html.replace('>Start Your 14-Day Free Trial →<', '>START YOUR 14-DAY FREE TRIAL →<')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Create 1200 by 630 NAT-CORP social image
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          source = Image.open('headquarters.webp').convert('RGB')
          width, height = 1200, 630
          scale = max(width / source.width, height / source.height)
          resized = source.resize(
              (round(source.width * scale), round(source.height * scale)),
              Image.Resampling.LANCZOS,
          )
          left = (resized.width - width) // 2
          top = (resized.height - height) // 2
          image = resized.crop((left, top, left + width, top + height)).convert('RGBA')

          overlay = Image.new('RGBA', (width, height), (0, 0, 0, 0))
          draw = ImageDraw.Draw(overlay)
          for x in range(width):
              ratio = x / width
              alpha = int(225 * max(0, 1 - ratio / 0.78))
              draw.line([(x, 0), (x, height)], fill=(7, 20, 47, alpha))
          draw.rectangle((0, 0, width, height), fill=(7, 20, 47, 32))
          image = Image.alpha_composite(image, overlay)
          draw = ImageDraw.Draw(image)

          bold_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          serif_path = '/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf'
          bold = lambda size: ImageFont.truetype(bold_path, size)
          regular = lambda size: ImageFont.truetype(regular_path, size)
          serif = lambda size: ImageFont.truetype(serif_path, size)

          draw.rounded_rectangle((64, 58, 140, 134), radius=10, fill='white')
          draw.text((79, 73), 'NC', font=bold(32), fill=(15, 42, 106))
          draw.text((158, 62), 'NATIONAL CORPORATE', font=bold(18), fill='white')
          draw.text((158, 89), 'CONTRACT EXCHANGE', font=bold(18), fill='white')
          draw.text((158, 119), 'APROPOS GROUP LLC', font=regular(13), fill=(183, 199, 226))
          draw.multiline_text(
              (64, 190),
              'State and Local\nGovernment Contract\nMatching',
              font=serif(50),
              fill='white',
              spacing=7,
          )
          draw.rectangle((64, 400, 380, 403), fill=(206, 169, 89))
          draw.multiline_text(
              (64, 430),
              'Guided onboarding. Personalized\nopportunity matching. Intelligent rankings.\nAnalyze Fit support.',
              font=regular(21),
              fill=(226, 234, 247),
              spacing=7,
          )
          draw.rounded_rectangle((64, 536, 480, 588), radius=6, fill='white')
          draw.text((84, 550), 'START YOUR 14-DAY FREE TRIAL', font=bold(17), fill=(15, 42, 106))

          image.convert('RGB').save(
              'og-natcorp.jpg',
              'JPEG',
              quality=92,
              optimize=True,
              progressive=True,
          )
          assert Image.open('og-natcorp.jpg').size == (1200, 630)
          PY

      - name: Validate corrected source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re
          from html.parser import HTMLParser
          from PIL import Image

          html = Path('index.html').read_text(encoding='utf-8')

          required = [
              '<title>State and Local Government Contract Matching | NAT-CORP</title>',
              'Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial.',
              'content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"',
              'href="https://natcorp.aproposgroupllc.com/"',
              'https://natcorp.aproposgroupllc.com/og-natcorp.jpg',
              'START YOUR 14-DAY FREE TRIAL',
              'MEMBER LOGIN',
              'NAT-CORP currently supports six states, with nationwide expansion underway.',
              'Additional Analyze Fit Report: $15 one-time',
              'Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.',
          ]
          for value in required:
              if value not in html:
                  raise SystemExit(f'Missing required value: {value}')

          if len(re.findall(r'<link\s+rel="canonical"', html, re.I)) != 1:
              raise SystemExit('Canonical count is not exactly one.')
          if len(re.findall(r'<h1(?:\s|>)', html, re.I)) != 1:
              raise SystemExit('H1 count is not exactly one.')

          match = re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('JSON-LD block missing.')
          data = json.loads(match.group(1))
          graph_types = {item.get('@type') for item in data.get('@graph', [])}
          if not {'Organization', 'WebSite', 'Service'} <= graph_types:
              raise SystemExit(f'Unexpected graph types: {graph_types}')
          service = next(item for item in data['@graph'] if item.get('@type') == 'Service')
          offer = service.get('offers', {})
          if offer.get('@type') != 'Offer':
              raise SystemExit('Nested Offer is missing.')
          if offer.get('price') != '119.00' or offer.get('priceCurrency') != 'USD':
              raise SystemExit('Offer price or currency is incorrect.')
          if offer.get('availability') != 'https://schema.org/InStock':
              raise SystemExit('Offer availability is not active.')
          if '14-day free trial' not in offer.get('description', ''):
              raise SystemExit('Offer trial description is missing.')

          prohibited = [
              r'Free Contract Discovery',
              r'Build a free business-matched dashboard',
              r'No subscription required',
              r'Contract discovery is free',
              r'Free opportunity matching',
              r'Analyze Fit \$19\.99',
              r'\$19\.99',
              r'all 50 states',
          ]
          for pattern in prohibited:
              if re.search(pattern, html, re.I):
                  raise SystemExit(f'Prohibited claim remains: {pattern}')

          if not Path('robots.txt').is_file() or not Path('sitemap.xml').is_file():
              raise SystemExit('robots.txt or sitemap.xml is missing.')
          if Image.open('og-natcorp.jpg').size != (1200, 630):
              raise SystemExit('Social image dimensions are incorrect.')

          print('NAT-CORP metadata and commercial validation: PASS')
          PY

      - name: Commit corrected homepage and social image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html og-natcorp.jpg
          git commit -m "Correct NAT-CORP production metadata and commercial language"
          git push origin HEAD:fix-natcorp-production-metadata-v1
