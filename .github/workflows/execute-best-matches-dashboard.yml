name: Execute Best Matches dashboard update

on:
  push:
    paths:
      - 'best-matches-dashboard-trigger.txt'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace default contract view and enforce descending rank
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('aois-dashboard-preview.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
              '<option value="score">Best match</option>': '<option value="score" selected>Best Matches</option>',
              '>All (Contracts)<': '>Best Matches<',
              '>All Contracts<': '>Best Matches<',
              '>All contracts<': '>Best Matches<',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Preserve and verify highest-to-lowest score ordering as the default branch.
          required_sort = ':scoreOf(b)-scoreOf(a)'
          if required_sort not in text:
              raise SystemExit('Descending score sort was not found; refusing unsafe update')

          if '<option value="score" selected>Best Matches</option>' not in text:
              raise SystemExit('Best Matches default option was not installed')

          p.write_text(text, encoding='utf-8')

          for file_name in [
              'best-matches-dashboard-trigger.txt',
              '.github/workflows/execute-best-matches-dashboard.yml',
          ]:
              q = Path(file_name)
              if q.exists():
                  q.unlink()
          PY

      - name: Verify and commit
        run: |
          grep -q '<option value="score" selected>Best Matches</option>' aois-dashboard-preview.html
          grep -q 'scoreOf(b)-scoreOf(a)' aois-dashboard-preview.html
          ! grep -q 'All (Contracts)' aois-dashboard-preview.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Default dashboard to Best Matches ranking'
          git push origin main
