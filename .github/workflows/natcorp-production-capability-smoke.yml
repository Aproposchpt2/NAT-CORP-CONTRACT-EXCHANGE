name: Nat-Corp Capability Preview Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/natcorp-production-capability-smoke.yml'
      - 'welcome.html'
      - 'netlify/functions/capability-profile-discover-background.mjs'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Exercise preview start, background discovery, and polling
        shell: bash
        run: |
          set -euo pipefail
          base='https://deploy-preview-59--national-corp-contract-exchange.netlify.app'
          payload='{"action":"start","contact_name":"Nat-Corp 502 Preview","business_name":"Apropos Group LLC","business_email":"natcorp-502-preview@aproposgroupllc.com","website":"https://aproposgroupllc.com","visitor_email":""}'

          for attempt in {1..30}; do
            code=$(curl --max-time 10 --silent --output /dev/null --write-out '%{http_code}' "${base}/intake" || true)
            if [ "$code" = '200' ]; then break; fi
            sleep 5
          done
          test "$code" = '200'

          start_code=$(curl --max-time 30 --silent --show-error \
            --cookie-jar cookies.txt \
            --header "Origin: ${base}" \
            --header "Referer: ${base}/intake" \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Content-Type: application/json' \
            --output start-body.json \
            --write-out '%{http_code}' \
            --data "$payload" \
            "${base}/api/capability-profile")
          echo "START_HTTP=${start_code}"
          test "$start_code" = '201'

          queue_code=$(curl --max-time 20 --silent --show-error \
            --cookie cookies.txt \
            --header "Origin: ${base}" \
            --header "Referer: ${base}/intake" \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Content-Type: application/json' \
            --output queue-body.txt \
            --write-out '%{http_code}' \
            --data '{}' \
            "${base}/api/capability-profile-discover")
          echo "QUEUE_HTTP=${queue_code}"
          test "$queue_code" = '202'

          final=''
          for attempt in {1..36}; do
            sleep 5
            poll_code=$(curl --max-time 20 --silent --show-error \
              --cookie cookies.txt \
              --header "Origin: ${base}" \
              --header "Referer: ${base}/intake" \
              --header 'Sec-Fetch-Site: same-origin' \
              --header 'Accept: application/json' \
              --output poll-body.json \
              --write-out '%{http_code}' \
              "${base}/api/capability-profile")
            test "$poll_code" = '200'
            final=$(jq -r '.session.discovery_status // ""' poll-body.json)
            echo "POLL_${attempt}=${final}"
            if [ "$final" = 'review_ready' ]; then break; fi
            if [ "$final" = 'failed' ]; then cat poll-body.json; exit 1; fi
          done
          test "$final" = 'review_ready'
          echo 'ASYNC_DISCOVERY_PASS'
