name: NAT-CORP Homepage Review Artifacts

on:
  push:
    branches:
      - seo-homepage-production-natcorp-v1

permissions:
  contents: read

jobs:
  capture-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://deploy-preview-56--national-corp-contract-exchange.netlify.app
    steps:
      - name: Check out implementation
        uses: actions/checkout@v4

      - name: Wait for preview availability
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL/" | grep -q "State and Local Government Contract Matching | NAT-CORP"; then
              echo "Preview is available."
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become available."
          exit 1

      - name: Install Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          mkdir -p review-artifacts
          cat > capture-review.js <<'NODE'
          const { chromium, devices } = require('playwright');

          (async () => {
            const url = process.env.PREVIEW_URL;
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              reducedMotion: 'reduce'
            });
            const desktopPage = await desktop.newPage();
            await desktopPage.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await desktopPage.screenshot({ path: 'review-artifacts/desktop-hero.png' });
            await desktopPage.screenshot({ path: 'review-artifacts/desktop-full-page.png', fullPage: true });
            await desktop.close();

            const mobile = await browser.newContext({
              ...devices['iPhone 13'],
              reducedMotion: 'reduce'
            });
            const mobilePage = await mobile.newPage();
            await mobilePage.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            await mobilePage.screenshot({ path: 'review-artifacts/mobile-hero.png' });
            await mobilePage.screenshot({ path: 'review-artifacts/mobile-full-page.png', fullPage: true });
            await mobile.close();

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node capture-review.js

      - name: Run public link tests
        shell: bash
        run: |
          set -uo pipefail
          paths=(
            "/"
            "/intake"
            "/member-login"
            "/proposal"
            "/support"
            "/privacy"
            "/terms"
            "/accessibility"
            "/robots.txt"
            "/sitemap.xml"
            "/assets/homepage-seo.css"
            "/headquarters.webp"
          )
          failed=0
          : > review-artifacts/link-test-results.txt
          for path in "${paths[@]}"; do
            code=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out "%{http_code}" "$PREVIEW_URL$path" || echo "000")
            printf "%s %s\n" "$code" "$path" | tee -a review-artifacts/link-test-results.txt
            if [[ ! "$code" =~ ^(200|204)$ ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Validate metadata and structured data
        shell: bash
        run: |
          cat > validate-review.js <<'NODE'
          const fs = require('fs');

          const expected = {
            title: 'State and Local Government Contract Matching | NAT-CORP',
            description: 'Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial.',
            canonical: 'https://natcorp.aproposgroupllc.com/'
          };

          (async () => {
            const response = await fetch(`${process.env.PREVIEW_URL}/`);
            if (!response.ok) throw new Error(`Homepage returned ${response.status}`);
            const html = await response.text();

            const extract = (pattern) => html.match(pattern)?.[1] || null;
            const title = extract(/<title>([^<]+)<\/title>/i);
            const description = extract(/<meta[^>]+content="([^"]+)"[^>]+name="description"/i);
            const canonical = extract(/<link[^>]+href="([^"]+)"[^>]+rel="canonical"/i);
            const h1Count = (html.match(/<h1\b/gi) || []).length;
            const jsonLdText = extract(/<script[^>]+type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/i);
            const jsonLd = JSON.parse(jsonLdText);
            const types = (jsonLd['@graph'] || []).map((node) => node['@type']);
            const offer = (jsonLd['@graph'] || []).find((node) => node['@type'] === 'Offer');

            const checks = {
              titleExact: title === expected.title,
              descriptionExact: description === expected.description,
              canonicalExact: canonical === expected.canonical,
              exactlyOneH1: h1Count === 1,
              organizationSchema: types.includes('Organization'),
              websiteSchema: types.includes('WebSite'),
              serviceSchema: types.includes('Service'),
              offerSchema: types.includes('Offer'),
              offerPrice: offer?.price === '119.00',
              offerCurrency: offer?.priceCurrency === 'USD',
              monthlyBilling: JSON.stringify(offer).includes('P1M'),
              fourteenDayTrial: JSON.stringify(offer).includes('P14D'),
              primaryCTA: html.includes('Start Your 14-Day Free Trial'),
              memberLogin: html.includes('Member Login'),
              sixStateLanguage: html.includes('currently includes six states'),
              transitionStatement: html.includes('Community economic development begins when qualified businesses gain meaningful access to opportunity.')
            };

            const result = { url: process.env.PREVIEW_URL, title, description, canonical, h1Count, schemaTypes: types, checks };
            fs.writeFileSync('review-artifacts/metadata-schema-validation.json', JSON.stringify(result, null, 2));
            const failed = Object.entries(checks).filter(([, value]) => !value);
            if (failed.length) throw new Error(`Validation failed: ${failed.map(([key]) => key).join(', ')}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node validate-review.js

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natcorp-homepage-review-package
          path: review-artifacts/
          if-no-files-found: error
          retention-days: 30
