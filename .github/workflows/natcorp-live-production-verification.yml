name: NAT-CORP Live Production Verification

on:
  push:
    branches:
      - fix-natcorp-production-metadata-v1
    paths:
      - .github/workflows/natcorp-live-production-verification.yml

permissions:
  contents: read

jobs:
  verify-live-production:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://natcorp.aproposgroupllc.com
    steps:
      - uses: actions/checkout@v4
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Retrieve uncached live source and public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-verification
          cache_bust="$(date +%s)-${GITHUB_SHA}"
          curl --fail --show-error --silent --location \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            -H 'Pragma: no-cache' \
            -D live-verification/live-homepage-headers.txt \
            "$PRODUCTION_URL/?production-verification=$cache_bust" \
            -o live-verification/live-index.html

          : > live-verification/live-link-tests.txt
          for path in / /intake /member-login /dashboard /robots.txt /sitemap.xml /og-natcorp.jpg /headquarters.webp; do
            code=$(curl --location --silent --show-error -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' "$PRODUCTION_URL$path?production-verification=$cache_bust")
            echo "$code $path" | tee -a live-verification/live-link-tests.txt
            test "$code" = "200"
          done

          curl --fail --show-error --silent --location -H 'Cache-Control: no-cache' "$PRODUCTION_URL/robots.txt?production-verification=$cache_bust" -o live-verification/robots.txt
          curl --fail --show-error --silent --location -H 'Cache-Control: no-cache' "$PRODUCTION_URL/sitemap.xml?production-verification=$cache_bust" -o live-verification/sitemap.xml
          curl --fail --show-error --silent --location -H 'Cache-Control: no-cache' "$PRODUCTION_URL/og-natcorp.jpg?production-verification=$cache_bust" -o live-verification/og-natcorp.jpg
      - name: Validate live HTML, metadata, schema, copy, links and indexing
        shell: bash
        run: |
          python <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from PIL import Image
          import json
          import re

          html = Path('live-verification/live-index.html').read_text(encoding='utf-8')

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = []
                  self.in_title = False
                  self.in_script = False
                  self.script_type = None
                  self.script_parts = []
                  self.json_ld = []
                  self.meta = []
                  self.links = []
                  self.anchors = []
                  self.h1_count = 0
                  self.text_parts = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'title': self.in_title = True
                  if tag == 'h1': self.h1_count += 1
                  if tag == 'meta': self.meta.append(attrs)
                  if tag == 'link': self.links.append(attrs)
                  if tag == 'a': self.anchors.append(attrs)
                  if tag == 'script':
                      self.in_script = True
                      self.script_type = attrs.get('type')
                      self.script_parts = []
              def handle_endtag(self, tag):
                  if tag == 'title': self.in_title = False
                  if tag == 'script':
                      if self.script_type == 'application/ld+json':
                          self.json_ld.append(''.join(self.script_parts))
                      self.in_script = False
                      self.script_type = None
                      self.script_parts = []
              def handle_data(self, data):
                  if self.in_title: self.title.append(data)
                  if self.in_script: self.script_parts.append(data)
                  else: self.text_parts.append(data)

          p = Inspector(); p.feed(html)
          title = ''.join(p.title).strip()
          text = re.sub(r'\s+', ' ', unescape(' '.join(p.text_parts))).strip()
          meta_by_name = {m.get('name'): m.get('content') for m in p.meta if m.get('name')}
          meta_by_property = {m.get('property'): m.get('content') for m in p.meta if m.get('property')}
          canonicals = [x.get('href') for x in p.links if (x.get('rel') or '').lower() == 'canonical']
          hrefs = [a.get('href') for a in p.anchors if a.get('href')]

          expected_title = 'State and Local Government Contract Matching | NAT-CORP'
          expected_description = 'Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial.'
          expected_canonical = 'https://natcorp.aproposgroupllc.com/'
          expected_image = 'https://natcorp.aproposgroupllc.com/og-natcorp.jpg'
          expected_stripe = 'https://buy.stripe.com/dRm8wOcw2d8X3cT7aU7EQ1f'
          expected_robots = 'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1'

          assert title == expected_title, title
          assert meta_by_name.get('description') == expected_description
          assert meta_by_name.get('robots') == expected_robots
          assert canonicals == [expected_canonical], canonicals
          assert p.h1_count == 1, p.h1_count

          assert meta_by_property.get('og:type') == 'website'
          assert meta_by_property.get('og:site_name') == 'National Corporate Contract Exchange'
          assert meta_by_property.get('og:title') == expected_title
          assert meta_by_property.get('og:description') == 'Licensed contractors receive guided onboarding, personalized public-sector contract matches, intelligent rankings, and Analyze Fit support.'
          assert meta_by_property.get('og:url') == expected_canonical
          assert meta_by_property.get('og:image') == expected_image
          assert meta_by_property.get('og:image:alt') == 'National Corporate Contract Exchange procurement intelligence platform'

          assert meta_by_name.get('twitter:card') == 'summary_large_image'
          assert meta_by_name.get('twitter:title') == expected_title
          assert meta_by_name.get('twitter:description') == 'Guided onboarding, personalized state and local opportunity matching, intelligent rankings, and Analyze Fit support.'
          assert meta_by_name.get('twitter:image') == expected_image

          assert expected_stripe in hrefs
          assert '/member-login' in hrefs
          assert '/intake' in hrefs

          required_copy = [
              'Start your 14-day free trial. Continue for $119 per month.',
              'Additional Analyze Fit Report: $15 one-time',
              'Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.',
              'NAT-CORP currently supports six states, with nationwide expansion underway.',
              'all licensed contractors',
              'Opportunity Builds Business. Business Builds Community.',
              'A Shared Commitment to Economic Opportunity.'
          ]
          for value in required_copy:
              assert value.lower() in text.lower(), value

          prohibited = [
              r'Free Contract Discovery',
              r'Build a free business-matched dashboard',
              r'No subscription required',
              r'Contract discovery is free',
              r'Free opportunity matching',
              r'\$19\.99',
              r'all 50 states'
          ]
          for pattern in prohibited:
              assert not re.search(pattern, text, re.I), pattern
          assert not re.search(r'Concierge Contract Service.{0,120}\$[0-9]', text, re.I), 'Concierge numeric price found'

          docs = [json.loads(raw) for raw in p.json_ld]
          graph_doc = next(d for d in docs if isinstance(d, dict) and isinstance(d.get('@graph'), list))
          graph = graph_doc['@graph']
          types = {item.get('@type') for item in graph}
          assert {'Organization', 'WebSite', 'Service'} <= types, types
          service = next(item for item in graph if item.get('@type') == 'Service')
          offer = service['offers']
          assert offer['@type'] == 'Offer'
          assert offer['name'] == 'NAT-CORP Monthly Membership'
          assert offer['price'] == '119.00'
          assert offer['priceCurrency'] == 'USD'
          assert offer['availability'] == 'https://schema.org/InStock'
          assert '14-day free trial' in offer['description']

          robots_txt = Path('live-verification/robots.txt').read_text(encoding='utf-8')
          assert 'User-agent:' in robots_txt
          assert not re.search(r'Disallow:\s*/\s*$', robots_txt, re.M), robots_txt
          sitemap = Path('live-verification/sitemap.xml').read_text(encoding='utf-8')
          assert 'https://natcorp.aproposgroupllc.com/' in sitemap
          assert Image.open('live-verification/og-natcorp.jpg').size == (1200, 630)

          result = {
              'production_url': 'https://natcorp.aproposgroupllc.com/',
              'title': title,
              'description': meta_by_name['description'],
              'robots_meta': meta_by_name['robots'],
              'canonical_count': len(canonicals),
              'canonical': canonicals[0],
              'h1_count': p.h1_count,
              'open_graph': {k: meta_by_property.get(k) for k in ['og:type','og:site_name','og:title','og:description','og:url','og:image','og:image:alt']},
              'twitter': {k: meta_by_name.get(k) for k in ['twitter:card','twitter:title','twitter:description','twitter:image']},
              'json_ld_types': sorted(types),
              'offer': offer,
              'trial_cta_href': expected_stripe,
              'member_login_href': '/member-login',
              'coverage_language': 'NAT-CORP currently supports six states, with nationwide expansion underway.',
              'social_image_dimensions': [1200, 630],
              'robots_indexable': True,
              'validation': 'PASS'
          }
          Path('live-verification/live-validation.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY
      - name: Upload live production verification package
        uses: actions/upload-artifact@v4
        with:
          name: natcorp-live-production-verification
          path: live-verification/
          retention-days: 30
