name: NAT-CORP Immutable Preview Validation

on:
  push:
    branches:
      - fix-natcorp-production-metadata-v1
    paths:
      - .github/workflows/natcorp-metadata-immutable-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://6a73f529315a1000086fac1f--national-corp-contract-exchange.netlify.app
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and image validation dependencies
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check pillow
      - name: Validate desktop, mobile, metadata, schema, copy and CTAs
        shell: bash
        run: |
          mkdir -p validation-artifacts
          cat > immutable-validate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium, devices } = require('playwright');
          const E = {
            title:'State and Local Government Contract Matching | NAT-CORP',
            desc:'Licensed contractors receive personalized state and local government contract matches, intelligent rankings, guided onboarding, Analyze Fit support, and a 14-day free trial.',
            canonical:'https://natcorp.aproposgroupllc.com/',
            robots:'index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1',
            image:'https://natcorp.aproposgroupllc.com/og-natcorp.jpg',
            stripe:'https://buy.stripe.com/dRm8wOcw2d8X3cT7aU7EQ1f'
          };
          async function validate(page,label){
            const response=await page.goto(process.env.PREVIEW_URL,{waitUntil:'networkidle',timeout:90000});
            if(!response||response.status()!==200) throw new Error(`${label}: homepage HTTP ${response?.status()}`);
            const d=await page.evaluate(()=>{
              const m=s=>document.querySelector(s)?.content||null;
              const cs=[...document.querySelectorAll('link[rel="canonical"]')];
              return {title:document.title,desc:m('meta[name="description"]'),robots:m('meta[name="robots"]'),canonicalCount:cs.length,canonical:cs[0]?.href||null,ogTitle:m('meta[property="og:title"]'),ogDesc:m('meta[property="og:description"]'),ogUrl:m('meta[property="og:url"]'),ogImage:m('meta[property="og:image"]'),ogAlt:m('meta[property="og:image:alt"]'),twCard:m('meta[name="twitter:card"]'),twTitle:m('meta[name="twitter:title"]'),twDesc:m('meta[name="twitter:description"]'),twImage:m('meta[name="twitter:image"]'),h1:document.querySelectorAll('h1').length,text:document.body.innerText,links:[...document.querySelectorAll('a')].map(a=>({text:a.textContent.trim(),href:a.href})),json:[...document.querySelectorAll('script[type="application/ld+json"]')].map(x=>x.textContent),vw:innerWidth,sw:document.documentElement.scrollWidth};
            });
            if(d.title!==E.title||d.desc!==E.desc||d.robots!==E.robots) throw new Error(`${label}: core metadata mismatch`);
            if(d.canonicalCount!==1||d.canonical!==E.canonical||d.h1!==1) throw new Error(`${label}: canonical/H1 mismatch`);
            if(d.ogTitle!==E.title||d.ogUrl!==E.canonical||d.ogImage!==E.image||d.ogAlt!=='National Corporate Contract Exchange procurement intelligence platform') throw new Error(`${label}: OG mismatch`);
            if(d.twCard!=='summary_large_image'||d.twTitle!==E.title||d.twImage!==E.image) throw new Error(`${label}: Twitter mismatch`);
            if(d.sw>d.vw+1) throw new Error(`${label}: horizontal overflow ${d.sw}/${d.vw}`);
            const trials=d.links.filter(x=>x.text.includes('START YOUR 14-DAY FREE TRIAL'));
            const logins=d.links.filter(x=>x.text.includes('MEMBER LOGIN'));
            if(!trials.length||trials.some(x=>x.href!==E.stripe)) throw new Error(`${label}: trial CTA mismatch`);
            if(!logins.length||logins.some(x=>new URL(x.href).pathname!=='/member-login')) throw new Error(`${label}: login CTA mismatch`);
            for(const s of ['Start your 14-day free trial. Continue for $119 per month.','Additional Analyze Fit Report: $15 one-time','Concierge Contract Service pricing will be announced after final service scope and operating-cost validation.','NAT-CORP currently supports six states, with nationwide expansion underway.','all licensed contractors']) if(!d.text.includes(s)) throw new Error(`${label}: missing ${s}`);
            for(const p of [/Free Contract Discovery/i,/Build a free business-matched dashboard/i,/No subscription required/i,/Contract discovery is free/i,/Free opportunity matching/i,/\$19\.99/i,/all 50 states/i]) if(p.test(d.text)||p.test(d.title)||p.test(d.desc||'')) throw new Error(`${label}: prohibited ${p}`);
            if(/Concierge Contract Service.{0,100}\$[0-9]/is.test(d.text)) throw new Error(`${label}: Concierge price published`);
            const docs=d.json.map(JSON.parse), graph=docs.find(x=>Array.isArray(x['@graph']))?.['@graph'];
            if(!graph) throw new Error(`${label}: JSON-LD graph missing`);
            const types=new Set(graph.map(x=>x['@type']));
            for(const t of ['Organization','WebSite','Service']) if(!types.has(t)) throw new Error(`${label}: ${t} missing`);
            const offer=graph.find(x=>x['@type']==='Service')?.offers;
            if(!offer||offer['@type']!=='Offer'||offer.name!=='NAT-CORP Monthly Membership'||offer.price!=='119.00'||offer.priceCurrency!=='USD'||offer.availability!=='https://schema.org/InStock'||!offer.description.includes('14-day free trial')) throw new Error(`${label}: Offer invalid`);
            return {...d,text:undefined,jsonLdParsed:docs,links:d.links.filter(x=>x.text.includes('TRIAL')||x.text.includes('MEMBER LOGIN'))};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const dc=await browser.newContext({viewport:{width:1440,height:1000},reducedMotion:'reduce'}),dp=await dc.newPage();
            const desktop=await validate(dp,'desktop'); await dp.screenshot({path:'validation-artifacts/desktop-hero.png'}); await dp.screenshot({path:'validation-artifacts/desktop-full-page.png',fullPage:true}); await dc.close();
            const mc=await browser.newContext({...devices['iPhone 13'],reducedMotion:'reduce'}),mp=await mc.newPage();
            const mobile=await validate(mp,'mobile'); await mp.screenshot({path:'validation-artifacts/mobile-hero.png'}); await mp.screenshot({path:'validation-artifacts/mobile-full-page.png',fullPage:true}); await mc.close();
            await browser.close(); fs.writeFileSync('validation-artifacts/metadata-schema-validation.json',JSON.stringify({preview:process.env.PREVIEW_URL,desktop,mobile},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node immutable-validate.cjs
      - name: Validate routes and social image
        shell: bash
        run: |
          set -euo pipefail
          : > validation-artifacts/link-test-results.txt
          for path in / /intake /member-login /dashboard /robots.txt /sitemap.xml /og-natcorp.jpg /headquarters.webp; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' "$PREVIEW_URL$path")
            echo "$code $path" | tee -a validation-artifacts/link-test-results.txt
            test "$code" = 200
          done
          curl -L -sS "$PREVIEW_URL/og-natcorp.jpg" -o validation-artifacts/og-natcorp.jpg
          python - <<'PY'
          from PIL import Image
          image=Image.open('validation-artifacts/og-natcorp.jpg')
          assert image.size==(1200,630), image.size
          print('Social image:', image.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: natcorp-production-metadata-immutable-validation
          path: validation-artifacts/
          retention-days: 30
