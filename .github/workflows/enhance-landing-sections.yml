name: Enhance landing page sections
on:
  push:
    paths:
      - 'landing-presence-trigger.txt'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade sections beneath hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
/* NAT-CORP LANDING PRESENCE UPGRADE */
.section{position:relative;overflow:hidden}
.section::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.06),transparent 34%)}
.section>.container{position:relative;z-index:1}
.mission-section{background:linear-gradient(145deg,#081b43 0%,#0f2a6a 58%,#132f70 100%);padding:7rem 0}
.mission-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:clamp(2.5rem,6vw,6rem);align-items:start}
.mission-heading{position:sticky;top:110px}
.mission-heading::after{content:"";display:block;width:84px;height:3px;margin-top:1.5rem;background:linear-gradient(90deg,#fff,rgba(255,255,255,.15))}
.mission-copy{font-size:1.04rem;color:#c8d4e8}
.mission-copy p{margin:0 0 1.15rem}
.mission-declaration{margin-top:1.7rem;padding:1.5rem 1.6rem;border:1px solid rgba(255,255,255,.25);border-left:4px solid #fff;background:rgba(255,255,255,.07);color:#fff;font-size:1.08rem;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.journey-section{background:linear-gradient(180deg,#07142f,#0a1d49);padding:6.5rem 0}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:2.5rem;position:relative}
.journey::before{content:"";position:absolute;top:34px;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,#8fa8d4 12%,#8fa8d4 88%,transparent)}
.journey-card{position:relative;padding:0 1rem;text-align:center}
.journey-num{position:relative;z-index:2;width:68px;height:68px;margin:0 auto 1.3rem;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0f2a6a;font-weight:700;box-shadow:0 0 0 10px rgba(255,255,255,.05),0 16px 35px rgba(0,0,0,.25)}
.journey-card h3{font:400 1.35rem Georgia,serif;color:#fff;margin:.25rem 0 .7rem}
.journey-card p{color:#aebdd5;font-size:.9rem}
.showcase-section{background:#eef3fb;color:#20324d;padding:6.5rem 0}
.showcase-section .eyebrow{color:#54709a}.showcase-section h2{color:#0f2a6a}
.showcase-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2.5rem,5vw,5rem);align-items:center}
.showcase-list{display:grid;gap:12px;margin-top:1.8rem}
.showcase-item{padding:1rem 1.1rem;border-left:3px solid #0f2a6a;background:#fff;box-shadow:0 8px 26px rgba(15,42,106,.08)}
.dashboard-mock{border-radius:18px;background:linear-gradient(145deg,#07142f,#102d6f);padding:22px;box-shadow:0 34px 80px rgba(9,24,54,.28);border:1px solid rgba(255,255,255,.16)}
.mock-head{display:flex;justify-content:space-between;color:#fff;margin-bottom:18px}.mock-chip{font-size:.65rem;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.3rem .65rem}
.mock-card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);padding:14px;border-radius:12px;margin-top:10px;color:#fff}
.mock-score{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:5px solid #74e0a7;font-weight:700}
.compare-section{background:linear-gradient(135deg,#102d6f,#07142f);padding:6.5rem 0}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:2rem}
.compare-panel{padding:2rem;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.compare-panel.featured{background:#fff;color:#23324a}.compare-panel.featured h3{color:#0f2a6a}.compare-panel h3{font:400 1.5rem Georgia,serif;color:#fff;margin-top:0}
.compare-panel ul{padding-left:1.1rem;line-height:2}
.final-cta-section{padding:5rem 0;background:#dfe8f6;color:#243650}
.final-cta{background:linear-gradient(135deg,#fff,#edf3fb);border:1px solid #c2d0e4;box-shadow:0 24px 70px rgba(15,42,106,.16);padding:clamp(2rem,5vw,4rem)}
.final-cta h2{color:#0f2a6a}.assurances{display:flex;gap:10px;flex-wrap:wrap;margin:1.2rem 0}.assurances span{background:#e7eef8;color:#18315f;padding:.45rem .75rem;border-radius:999px;font-size:.76rem;font-weight:600}
.faq-section{background:#f7f9fc;color:#2b3a51}.faq-section h2{color:#0f2a6a}.faq-section .faq details{background:#fff;border-color:#d7e0ec;box-shadow:0 8px 24px rgba(15,42,106,.05)}.faq-section .faq summary{color:#0f2a6a}.faq-section .faq details p{color:#5f6e83}
@media(max-width:900px){.mission-layout,.showcase-wrap,.compare-grid{grid-template-columns:1fr}.mission-heading{position:static}.journey{grid-template-columns:1fr 1fr;gap:2rem}.journey::before{display:none}}
@media(max-width:600px){.journey{grid-template-columns:1fr}.mission-section,.journey-section,.showcase-section,.compare-section{padding:4.5rem 0}}
'''
          s=s.replace('</style>',css+'</style>',1)
          old='<section class="section" id="mission"><div class="container"><div class="eyebrow">Our Commitment</div><h2>A Shared Commitment to Economic Opportunity.</h2><p class="intro">When opportunity reaches businesses, prosperity reaches communities. National Corporate Contract Exchange is our contribution to that shared mission.</p><p>Apropos Group LLC recognizes that lasting economic progress is built through collaboration. Business-development organizations, workforce advocates, community institutions, local businesses, and those working to expand economic opportunity all play an important role.</p><p>By helping businesses discover government contracting opportunities and participate more effectively in the public marketplace, we aim to support the work already being done to strengthen local economies, create pathways to employment, and build more prosperous communities.</p><p><strong>Apropos Group LLC is proud to stand with those who are committed to helping businesses succeed, creating pathways to employment, and building stronger, more prosperous communities.</strong></p><p>We are not working apart from that mission. We are proud to be part of it.</p></div></section>'
          new='<section class="section mission-section" id="mission"><div class="container mission-layout"><div class="mission-heading"><div class="eyebrow">Our Commitment</div><h2>A Shared Commitment to Economic Opportunity.</h2></div><div class="mission-copy"><p class="intro">When opportunity reaches businesses, prosperity reaches communities. National Corporate Contract Exchange is our contribution to that shared mission.</p><p>Apropos Group LLC recognizes that lasting economic progress is built through collaboration. Business-development organizations, workforce advocates, community institutions, local businesses, and those working to expand economic opportunity all play an important role.</p><p>By helping businesses discover government contracting opportunities and participate more effectively in the public marketplace, we aim to support the work already being done to strengthen local economies, create pathways to employment, and build more prosperous communities.</p><div class="mission-declaration"><strong>Apropos Group LLC is proud to stand with those who are committed to helping businesses succeed, creating pathways to employment, and building stronger, more prosperous communities.</strong></div><p>We are not working apart from that mission. We are proud to be part of it.</p></div></div></section>'
          if old not in s: raise SystemExit('mission block not found')
          s=s.replace(old,new,1)
          start=s.index('<section class="section" id="how">')
          end=s.index('<section class="section faq" id="faq">')
          replacement='''<section class="section journey-section" id="how"><div class="container"><div class="eyebrow">One clear journey</div><h2>Start. Intake. Business Intelligence. Best Matches.</h2><p class="intro">Begin with your business, establish what you can deliver, and receive a ranked opportunity market built around your capabilities.</p><div class="journey"><article class="journey-card"><div class="journey-num">01</div><h3>Start</h3><p>Enter through one clear public starting point.</p></article><article class="journey-card"><div class="journey-num">02</div><h3>Intake</h3><p>Provide the business and contact information for this visit.</p></article><article class="journey-card"><div class="journey-num">03</div><h3>Business Intelligence</h3><p>Define service states, business roles, capabilities, and delivery capacity.</p></article><article class="journey-card"><div class="journey-num">04</div><h3>Best Matches</h3><p>Review opportunities ranked from strongest to weakest fit.</p></article></div></div></section><section class="section showcase-section"><div class="container showcase-wrap"><div><div class="eyebrow">Procurement intelligence</div><h2>See more than a list of contracts.</h2><p>National Corporate Contract Exchange turns public opportunity records into a business-centered decision environment.</p><div class="showcase-list"><div class="showcase-item"><strong>Ranked Best Matches</strong><br>Highest-fit opportunities appear first.</div><div class="showcase-item"><strong>Fit-score intelligence</strong><br>Understand why an opportunity aligns.</div><div class="showcase-item"><strong>Deadline awareness</strong><br>See urgency before investing pursuit time.</div><div class="showcase-item"><strong>Analyze Fit</strong><br>Move from discovery into executive decision support.</div></div></div><div class="dashboard-mock" aria-label="Illustration of the Best Matches dashboard"><div class="mock-head"><strong>Best Matches</strong><span class="mock-chip">Live opportunity intelligence</span></div><div class="mock-card"><div class="mock-score">94%</div><div><strong>Technology Modernization Services</strong><br><small>Strong capability alignment · 18 days remaining</small></div></div><div class="mock-card"><div class="mock-score">87%</div><div><strong>Business Support and Technical Services</strong><br><small>High evidence alignment · 24 days remaining</small></div></div><div class="mock-card"><div class="mock-score">79%</div><div><strong>Data and Systems Integration</strong><br><small>Qualified review candidate · 31 days remaining</small></div></div></div></div></section><section class="section compare-section"><div class="container"><div class="eyebrow">A different standard</div><h2>Intelligence, not another bid board.</h2><div class="compare-grid"><div class="compare-panel"><h3>Ordinary Contract Search</h3><ul><li>Lists large volumes of opportunities</li><li>Requires manual screening</li><li>Presents raw notice information</li><li>Leaves fit interpretation to the user</li></ul></div><div class="compare-panel featured"><h3>NAT-CORP Intelligence</h3><ul><li>Ranks business-aligned opportunities</li><li>Applies Business Intake evidence</li><li>Highlights deadlines and decision factors</li><li>Explains why each opportunity matches</li></ul></div></div></div></section><section class="section final-cta-section"><div class="container final-cta"><div><div class="eyebrow">Free access</div><h2>Build your government opportunity intelligence dashboard.</h2><p>Begin with your business. Discover what fits.</p><div class="assurances"><span>No subscription</span><span>No payment card</span><span>Fresh personalized assessment</span></div></div><a class="btn primary" href="/intake">Start Free →</a></div></section>'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('<section class="section faq" id="faq">','<section class="section faq faq-section" id="faq">',1)
          p.write_text(s,encoding='utf-8')
          for f in ['landing-presence-trigger.txt','.github/workflows/enhance-landing-sections.yml']:
              q=Path(f)
              if q.exists(): q.unlink()
          PY
      - name: Verify and commit
        run: |
          grep -q 'NAT-CORP LANDING PRESENCE UPGRADE' index.html
          grep -q 'A Shared Commitment to Economic Opportunity.' index.html
          grep -q 'Intelligence, not another bid board.' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add presence to landing page sections'
          git push origin main
