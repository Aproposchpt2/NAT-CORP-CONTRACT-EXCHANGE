<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analyze Fit Report | APROPOS GROUP LLC</title><link rel="stylesheet" href="/assets/analyze-fit-readable.css"></head><body>
<header class="toolbar"><div class="toolbar-inner"><div class="toolbar-brand"><img src="/assets/apropos-group-logo.jpg" alt="APROPOS GROUP LLC"><div>APROPOS Analyze Fit<small>Government Opportunity Intelligence</small></div></div><div class="actions"><button class="btn" id="backBtn">Return to Dashboard</button><button class="btn white" id="printBtn" disabled>Print / Save PDF</button><button class="btn primary" id="wordBtn" disabled>Download Word Report</button></div></div></header>
<div class="status" id="status">Validating the opportunity and business profile…</div><main class="report" id="report" hidden></main>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:[],text=v=>String(v??'').trim(),clip=(v,n=280)=>{const s=text(v).replace(/\s+/g,' ');return s.length>n?s.slice(0,n-1).trim()+'…':s},pretty=v=>text(v).replaceAll('_',' ').replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase()),fmt=v=>{const d=v?new Date(v):null;return d&&!Number.isNaN(d.valueOf())?d.toLocaleString():'Not provided'};
function decode(value){try{let s=value.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}catch{return null}}
const input=decode(new URLSearchParams(location.hash.slice(1)).get('assessment')||'');history.replaceState(null,'','/analyze-fit');let responseData=null;
const list=(items,max=5)=>{const v=arr(items).filter(Boolean).slice(0,max);return v.length?`<ul class="clean-list">${v.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>`:'<p><em>Not identified in the available evidence.</em></p>'};
const tone=v=>{const s=text(v).toLowerCase();return /critical/.test(s)?'critical':/high|gap|no-go|do not/.test(s)?'high':/strong|aligned|go|pursue|low/.test(s)?'strong':/medium|partial|conditional|verify|unknown|information/.test(s)?'medium':'information'};
const recLabel=v=>{const s=text(v).toUpperCase();return s==='GO'||s==='PURSUE'?'GO':s==='NO-GO'||s==='DO_NOT_PURSUE'||s==='NO_BID'?'DO NOT PURSUE':'CONDITIONAL GO'};
function head(n,title,deck,meta){return `<div class="page-head"><div class="page-brand"><img src="/assets/apropos-group-logo.jpg" alt=""><div>APROPOS GROUP LLC<span>Government Opportunity Intelligence</span></div></div><div class="page-meta">${esc(meta||'Analyze Fit Report')}<br>Page ${n} of 6</div></div><div class="page-number">${String(n).padStart(2,'0')}</div><h1 class="page-title">${esc(title)}</h1><p class="page-deck">${esc(deck)}</p>`}
const foot=n=>`<div class="page-foot"><span>CONFIDENTIAL · Prepared by APROPOS GROUP LLC</span><span>Page ${n}</span></div>`;
function banner(score,rec){return `<div class="decision-banner"><div class="score"><b>${esc(score)}</b><small>FIT SCORE / 100</small></div><div class="rec"><b>${esc(recLabel(rec))}</b><span>${recLabel(rec)==='CONDITIONAL GO'?'Close mandatory conditions before authorization.':recLabel(rec)==='GO'?'Proceed after official-source validation.':'Resolve disqualifying findings before pursuit.'}</span></div><div class="ready">${recLabel(rec)==='GO'?'READY TO VALIDATE':recLabel(rec)==='DO NOT PURSUE'?'NOT READY':'CONDITIONAL'}<small>PROPOSAL READINESS</small></div></div>`}
function facts(bid,standard){const rows=[['Agency',bid.agency],['Solicitation / Record',bid.solicitation_number||bid.id],['Response Deadline',fmt(bid.response_deadline)],['State / Jurisdiction',bid.state_code],['Procurement Type',bid.procurement_type||bid.bid_type],['Report Standard',standard]];return `<dl class="facts">${rows.map(([k,v])=>`<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v||'Not provided')}</dd></div>`).join('')}</dl>`}
function fitCards(items){const v=arr(items).slice(0,4);return `<div class="fit-grid">${v.map(x=>`<article class="fit-card"><h3>${esc(x.requirement||'Requirement')}</h3><span class="status-tag ${tone(x.rating)}">${esc(x.rating||'VERIFY')}</span><p><strong>Evidence:</strong> ${esc(x.evidence||'Not supplied')}</p><p><strong>Close:</strong> ${esc(x.action||x.gap||'Verify against official records.')}</p></article>`).join('')||'<p>No requirement-level findings were returned.</p>'}</div>`}
function eligibilityCards(items){return `<div class="eligibility-grid">${arr(items).slice(0,3).map(x=>`<article class="eligibility"><h3>${esc(x.factor||'Readiness gate')}</h3><span class="status-tag ${tone(x.status)}">${esc(x.status||'VERIFY')}</span><p>${esc(x.detail||'')}</p><p><em>${esc(x.executive_note||'Complete official validation.')}</em></p></article>`).join('')}</div>`}
function riskCards(items){const v=arr(items).slice(0,4);return `<div class="risk-grid">${v.map(x=>`<article class="risk-card ${tone(x.level)}"><h3>${esc(x.domain||'Risk')}</h3><span class="status-tag ${tone(x.level)}">${esc(x.level||'INFORMATION')}</span><p><strong>Why:</strong> ${esc(x.finding||'Not specified')}</p><p><strong>Mitigation:</strong> ${esc(x.mitigation||'Assign an owner and closure evidence.')}</p></article>`).join('')||'<p>No risk records were returned.</p>'}</div>`}
function actionGrid(plan){const blocks=[['01','Immediate / 24 hours',plan.immediate],['02','Next 72 hours',plan.next_72_hours],['03','First week / review',plan.first_week]];return `<div class="action-grid">${blocks.map(([n,t,i])=>`<article class="action"><div class="num">${n}</div><h3>${t}</h3>${list(i,3)}</article>`).join('')}</div>`}
function conditions(items){return `<div class="conditions">${arr(items).slice(0,4).map((x,i)=>`<div class="condition"><b>${i+1}</b><span>${esc(x)}</span></div>`).join('')}</div>`}
function render(data){responseData=data;const bid=input.bid||{},profile=input.profile||{},a=data.analysis||{},score=a.score??'—',rec=a.recommendation||'CONDITIONAL';const business=profile.business_name||profile.legal_name||'Client Organization',sol=bid.solicitation_number||bid.id||'Not provided',meta=`${sol} · ${new Date().toLocaleDateString()}`;const strengths=arr(a.strategic_alignment).slice(0,4),position=a.competitive_position||{},concerns=[...arr(position.weaknesses),...arr(position.threats)].slice(0,4);const risks=arr(a.risks),high=risks.filter(x=>/HIGH|CRITICAL/i.test(x.level||'')).length;const plan=a.action_plan||{};const docs=arr(a.documents_needed).slice(0,4),questions=arr(a.questions_for_buyer).slice(0,4);const pages=[];
pages.push(`<section class="report-page cover"><img class="cover-logo" src="/assets/apropos-group-logo.jpg" alt="APROPOS GROUP LLC"><div class="cover-kicker">ANALYZE FIT REPORT</div><h1>Business-to-Contract Fit Assessment</h1><div class="cover-sub">A readable executive decision report</div><div class="prepared"><small>PREPARED FOR</small><strong>${esc(business)}</strong><b>${esc(bid.title||'Selected Opportunity')}</b><div>${esc(bid.agency||'Public Agency')} · ${esc(sol)}</div></div>${banner(score,rec)}<p>${esc(data.report_standard||'APROPOS-ANALYZE-FIT-READABLE-v2')} · Prepared ${new Date().toLocaleDateString()}</p>${foot(1)}</section>`);
pages.push(`<section class="report-page">${head(2,'Executive Decision Summary','The decision, in plain language, before the detailed analysis.',meta)}${banner(score,rec)}<div class="callout"><h2>EXECUTIVE SUMMARY</h2><p>${esc(a.executive_summary||'The available evidence supports a controlled opportunity review.')}</p></div><p>${esc(a.rationale||'The recommendation reflects eligibility, capability evidence, schedule, pricing and delivery risk.')}</p><div class="two-col"><div class="list-card green"><h3>Why the opportunity fits</h3>${list(strengths,4)}</div><div class="list-card amber"><h3>Why the decision is conditional or negative</h3>${list(concerns,4)}</div></div><div class="callout red"><h3>DECISION RULE</h3><p>${recLabel(rec)==='GO'?'Authorize pursuit after official-source and evidence validation.':recLabel(rec)==='DO NOT PURSUE'?'Do not commit proposal resources unless disqualifying findings are resolved.':'Do not authorize final bid production until every mandatory eligibility, evidence, staffing, pricing and compliance condition is closed.'}</p></div>${foot(2)}</section>`);
pages.push(`<section class="report-page">${head(3,'Fit Analysis','A readable comparison of the business profile against the actual contract evidence.',meta)}<h2 class="section-label">Opportunity overview</h2>${facts(bid,data.report_standard)}<h2 class="section-label">Business-to-requirement fit</h2>${fitCards(a.capability_evidence)}<h2 class="section-label">Eligibility and readiness gates</h2>${eligibilityCards(a.eligibility)}${foot(3)}</section>`);
pages.push(`<section class="report-page">${head(4,'Risk Assessment','The most consequential pursuit and performance risks, presented as readable decision cards.',meta)}${riskCards(risks)}<div class="callout red"><h3>RISK POSTURE</h3><p>${high?`The assessment identifies ${high} high or critical risk finding${high===1?'':'s'}. Close every displayed risk before authorization.`:'No high-risk item is visible, but unknown and incomplete evidence must still be closed.'}</p></div>${foot(4)}</section>`);
pages.push(`<section class="report-page">${head(5,'Proposal Development Plan','A controlled validation and preparation sequence—not a generic checklist.',meta)}${actionGrid(plan)}<div class="two-col" style="margin-top:12px"><div class="list-card"><h3>Documents and evidence needed</h3>${list(docs,4)}</div><div class="list-card"><h3>Questions for the buyer</h3>${list(questions,4)}</div></div>${foot(5)}</section>`);
pages.push(`<section class="report-page">${head(6,'Executive Recommendation','The formal management gate and the evidence required to support it.',meta)}${banner(score,rec)}<div class="callout"><h3>FINAL RECOMMENDATION</h3><p>${esc(a.rationale||'Complete every mandatory validation gate before authorization.')}</p></div><h2 class="section-label">Conditions for authorization</h2>${conditions(a.decision_conditions)}<div class="management"><h3>MANAGEMENT DECISION</h3><div class="choices"><span>☐ APPROVE PURSUIT</span><span>☐ APPROVE WITH CONDITIONS</span><span>☐ DO NOT PURSUE</span></div><div class="signatures"><span>Authorized Executive / Signature</span><span>Date</span><span>Decision Record ID</span></div></div><h2 class="section-label">Source notes and limitations</h2>${list(a.source_notes,4)}${foot(6)}</section>`);
$('report').innerHTML=pages.join('');$('report').hidden=false;$('status').hidden=true;$('printBtn').disabled=false;$('wordBtn').disabled=false}
async function run(){if(!input?.bid?.title||!input?.profile?.business_name){$('status').className='status error';$('status').textContent='Analyze Fit must be opened from a live intake and dashboard session.';return}try{const r=await fetch('/api/analyze-fit-state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bid:input.bid,profile:input.profile})}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Assessment service failed.');render(d)}catch(e){$('status').className='status error';$('status').textContent=e.message}}
async function downloadWord(){if(!responseData)return;const btn=$('wordBtn');btn.disabled=true;btn.textContent='Building Word Report…';try{const r=await fetch('/api/analyze-fit-docx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bid:input.bid,profile:input.profile,analysis:responseData.analysis,report_standard:responseData.report_standard})});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Word report could not be generated.');const blob=await r.blob(),a=document.createElement('a'),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="?([^";]+)"?/i);a.href=URL.createObjectURL(blob);a.download=m?.[1]||'APROPOS_Analyze_Fit_Report.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){$('status').hidden=false;$('status').className='status error';$('status').textContent=e.message}finally{btn.disabled=false;btn.textContent='Download Word Report'}}
$('backBtn').onclick=()=>history.length>1?history.back():location.assign('/intake');$('printBtn').onclick=()=>print();$('wordBtn').onclick=downloadWord;run();
</script></body></html>
