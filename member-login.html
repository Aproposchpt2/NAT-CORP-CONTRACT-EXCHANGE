<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAT-CORP Member Login</title><meta name="robots" content="noindex"><style>:root{--navy:#07142f;--blue:#0f2a6a;--muted:#a8b7d2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#07142f,#0f2a6a);color:#fff;font:16px/1.6 Arial,sans-serif}.card{width:min(480px,100%);padding:34px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18)}h1{font:400 2.2rem Georgia,serif;margin:.2rem 0}.eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#c8d5ec}p{color:var(--muted)}label{display:block;margin:16px 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}input{width:100%;padding:13px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.18);color:#fff;font-size:1rem}.btn{width:100%;margin-top:16px;padding:14px;border:0;background:#fff;color:var(--blue);font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{min-height:24px;margin-top:12px;color:#ffd0d5}.hidden{display:none}.back{display:block;margin-top:18px;color:var(--muted)}</style><link rel="stylesheet" href="/natcorp-ops-parity.css"></head><body class="natcorp-auth-page member-auth"><main class="card"><div class="eyebrow">National Corporate Contract Exchange</div><section id="emailStep"><h1>Member Login</h1><p>Enter the email used for your NAT-CORP trial or subscription. We will send a secure one-time code.</p><label for="email">Business email</label><input id="email" type="email" autocomplete="email"><button class="btn" id="send">Send login code →</button></section><section id="codeStep" class="hidden"><h1>Check your email</h1><p>Enter the 6-digit code sent to <strong id="echo"></strong>.</p><label for="code">Login code</label><input id="code" inputmode="numeric" maxlength="6"><button class="btn" id="verify">Open my dashboard →</button></section><div class="msg" id="msg"></div><a class="back" href="/">← Return home</a></main><script>'use strict';const $=id=>document.getElementById(id);let memberEmail='';function encode(value){const bytes=new TextEncoder().encode(JSON.stringify(value));let binary='';bytes.forEach(byte=>binary+=String.fromCharCode(byte));return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed.');return data}$('send').onclick=async()=>{memberEmail=$('email').value.trim().toLowerCase();$('msg').textContent='';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(memberEmail))return $('msg').textContent='Enter a valid email address.';$('send').disabled=true;try{await post('/api/member-login-request',{email:memberEmail});$('echo').textContent=memberEmail;$('emailStep').classList.add('hidden');$('codeStep').classList.remove('hidden');$('code').focus()}catch(error){$('msg').textContent=error.message}$('send').disabled=false};$('verify').onclick=async()=>{$('msg').textContent='';$('verify').disabled=true;try{const data=await post('/api/member-login-verify',{email:memberEmail,code:$('code').value.trim()});location.assign('/dashboard#profile='+encode(data.profile))}catch(error){$('msg').textContent=error.message;$('verify').disabled=false}};$('email').onkeydown=e=>{if(e.key==='Enter')$('send').click()};$('code').onkeydown=e=>{if(e.key==='Enter')$('verify').click()};</script></body></html>
