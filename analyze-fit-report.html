<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analyze Fit Report | APROPOS GROUP LLC</title><link rel="stylesheet" href="/assets/analyze-fit-readable.css"></head><body>
<header class="toolbar"><div class="toolbar-inner"><div class="toolbar-brand"><img src="/assets/apropos-group-logo.jpg" alt="APROPOS GROUP LLC"><div>APROPOS Analyze Fit<small>Government Opportunity Intelligence</small></div></div><div class="actions"><a class="btn" href="/opportunity-services">Opportunity Services</a><button class="btn white" id="printBtn" disabled>Print / Save PDF</button><button class="btn primary" id="wordBtn" disabled>Download Word Report</button><button class="btn white" id="emailBtn" disabled>Email Report Again</button></div></div></header>
<div class="status" id="status">Loading the contract-specific report…</div><main class="report" id="report" hidden></main>
<script>
'use strict';
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),requestId=qs.get('request')||'',token=qs.get('token')||'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:[],text=v=>String(v??'').trim(),clip=(v,n=280)=>{const s=text(v).replace(/\s+/g,' ');return s.length>n?s.slice(0,n-1).trim()+'…':s},fmt=v=>{const d=v?new Date(v):null;return d&&!Number.isNaN(d.valueOf())?d.toLocaleString():'Not provided'};let payload=null;
const scalar=v=>{if(v==null)return'';if(['string','number','boolean'].includes(typeof v))return String(v);if(Array.isArray(v))return v.map(scalar).filter(Boolean).join('; ');if(typeof v==='object')return Object.entries(v).map(([k,x])=>`${k.replaceAll('_',' ')}: ${scalar(x)}`).join('; ');return String(v)};
const list=(items,max=5)=>{const v=arr(items).filter(Boolean).slice(0,max);return v.length?`<ul class="clean-list">${v.map(x=>`<li>${esc(scalar(x))}</li>`).join('')}</ul>`:'<p><em>Not identified in the available evidence.</em></p>'};
const tone=v=>{const s=text(v).toLowerCase();return /critical/.test(s)?'critical':/high|gap|do not/.test(s)?'high':/strong|aligned|relevant|pursue|low/.test(s)?'strong':/medium|partial|conditional|verify|unknown|information|unverified/.test(s)?'medium':'information'};
const recLabel=v=>{const s=text(v).toUpperCase();return s==='PURSUE'||s==='GO'?'GO':s==='DO_NOT_PURSUE'||s==='NO-GO'?'DO NOT PURSUE':'CONDITIONAL GO'};
function head(n,title,deck,meta){return `<div class="page-head"><div class="page-brand"><img src="/assets/apropos-group-logo.jpg" alt=""><div>APROPOS GROUP LLC<span>Government Opportunity Intelligence</span></div></div><div class="page-meta">${esc(meta)}<br>Page ${n} of 6</div></div><div class="page-number">${String(n).padStart(2,'0')}</div><h1 class="page-title">${esc(title)}</h1><p class="page-deck">${esc(deck)}</p>`}
const foot=n=>`<div class="page-foot"><span>CONFIDENTIAL · Prepared by APROPOS GROUP LLC</span><span>Page ${n}</span></div>`;
function banner(score,rec,readiness=''){return `<div class="decision-banner"><div class="score"><b>${esc(score)}</b><small>FIT SCORE / 100</small></div><div class="rec"><b>${esc(recLabel(rec))}</b><span>${recLabel(rec)==='CONDITIONAL GO'?'Close mandatory conditions before authorization.':recLabel(rec)==='GO'?'Proceed after official-source validation.':'Resolve disqualifying findings before pursuit.'}</span></div><div class="ready">${esc(readiness||recLabel(rec))}<small>PROPOSAL READINESS</small></div></div>`}
function facts(o,standard){const rows=[['Agency',o.issuing_organization||o.issuing_department],['Solicitation / Record',o.solicitation_number||o.pdas_record_id||o.id],['Response Deadline',fmt(o.response_deadline)],['State / Jurisdiction',o.state_code],['Procurement Type',o.procurement_type||o.bid_type],['Report Standard',standard]];return `<dl class="facts">${rows.map(([k,v])=>`<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v||'Not provided')}</dd></div>`).join('')}</dl>`}
function capability(items){return `<div class="fit-grid">${arr(items).slice(0,4).map(x=>`<article class="fit-card"><h3>${esc(x.requirement||'Requirement')}</h3><span class="status-tag ${tone(x.status)}">${esc(x.status||'UNVERIFIED')}</span><p><strong>Evidence:</strong> ${esc(x.business_evidence||'Not supplied')}</p><p><strong>Close:</strong> ${esc(x.note||'Verify against official records.')}</p></article>`).join('')||'<p>No capability-alignment records were returned.</p>'}</div>`}
function eligibility(a){const items=[...arr(a.licensing_qualification_review).slice(0,2),...arr(a.capacity_delivery_review).slice(0,1)];return `<div class="eligibility-grid">${items.map(x=>`<article class="eligibility"><h3>${esc(x.requirement||x.area||x.qualification||'Readiness gate')}</h3><span class="status-tag ${tone(x.status||'VERIFY')}">${esc(x.status||'VERIFY')}</span><p>${esc(x.description||x.finding||x.note||scalar(x))}</p><p><em>${esc(x.action||'Complete official validation.')}</em></p></article>`).join('')}</div>`}
function risks(items){return `<div class="risk-grid">${arr(items).slice(0,4).map(x=>`<article class="risk-card ${tone(x.level)}"><h3>${esc(x.domain||'Risk')}</h3><span class="status-tag ${tone(x.level)}">${esc(x.level||'INFORMATION')}</span><p><strong>Why:</strong> ${esc(x.finding||'Not specified')}</p><p><strong>Mitigation:</strong> ${esc(x.mitigation||'Assign an owner and closure evidence.')}</p></article>`).join('')||'<p>No risk records were returned.</p>'}</div>`}
function actionGrid(items){const v=arr(items),blocks=[['01','Immediate / 24 hours',v.slice(0,3)],['02','Next 72 hours',v.slice(3,6)],['03','First week / review',v.slice(6,9)]];return `<div class="action-grid">${blocks.map(([n,t,i])=>`<article class="action"><div class="num">${n}</div><h3>${t}</h3>${list(i,3)}</article>`).join('')}</div>`}
function conditions(items){return `<div class="conditions">${arr(items).slice(0,4).map((x,i)=>`<div class="condition"><b>${i+1}</b><span>${esc(scalar(x))}</span></div>`).join('')}</div>`}
async function api(url,opts={}){const r=await fetch(url,{cache:'no-store',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function render(d){payload=d;const a=d.run?.analysis||{},o=d.opportunity||{},b=d.business||{},score=d.run?.score??'—',rec=d.run?.recommendation||'CONDITIONAL',business=b.business_name||'Client Organization',sol=o.solicitation_number||o.pdas_record_id||o.id||'Not provided',standard=d.report?.report_version||'APROPOS-ANALYZE-FIT-READABLE-v2',meta=`${sol} · ${d.run?.completed_at?new Date(d.run.completed_at).toLocaleDateString():new Date().toLocaleDateString()}`;const strengths=[...arr(a.evidence_guardrails),...arr(a.contract_requirements)].slice(0,4),concerns=[...arr(a.unavailable_contract_details),...arr(a.unavailable_business_details)].slice(0,4),high=arr(a.risks).filter(x=>/HIGH|CRITICAL/i.test(x.level||'')).length,docs=[...arr(a.contract_requirements),...arr(a.licensing_qualification_review).map(x=>x.requirement||x.qualification).filter(Boolean)].slice(0,4),questions=arr(a.unavailable_contract_details).slice(0,4),readiness=a.proposal_readiness||recLabel(rec);const pages=[];
pages.push(`<section class="report-page cover"><img class="cover-logo" src="/assets/apropos-group-logo.jpg" alt="APROPOS GROUP LLC"><div class="cover-kicker">ANALYZE FIT REPORT</div><h1>Business-to-Contract Fit Assessment</h1><div class="cover-sub">A readable executive decision report</div><div class="prepared"><small>PREPARED FOR</small><strong>${esc(business)}</strong><b>${esc(o.title||'Selected Contract')}</b><div>${esc(o.issuing_organization||o.issuing_department||'Public Agency')} · ${esc(sol)}</div></div>${banner(score,rec,readiness)}<p>${esc(standard)} · Prepared ${new Date().toLocaleDateString()}</p>${foot(1)}</section>`);
pages.push(`<section class="report-page">${head(2,'Executive Decision Summary','The decision, in plain language, before the detailed analysis.',meta)}${banner(score,rec,readiness)}<div class="callout"><h2>EXECUTIVE SUMMARY</h2><p>${esc(a.executive_summary||'The available evidence supports a controlled opportunity review.')}</p></div><p>${esc(a.rationale||'The recommendation reflects capability alignment, eligibility, evidence quality, schedule, compliance burden and delivery risk.')}</p><div class="two-col"><div class="list-card green"><h3>Why the opportunity fits</h3>${list(strengths,4)}</div><div class="list-card amber"><h3>Why the decision is conditional or negative</h3>${list(concerns,4)}</div></div><div class="callout red"><h3>DECISION RULE</h3><p>${recLabel(rec)==='GO'?'Authorize pursuit after official-source and evidence validation.':recLabel(rec)==='DO NOT PURSUE'?'Do not commit proposal resources unless disqualifying findings are resolved.':'Do not authorize final bid production until every mandatory eligibility, evidence, staffing, pricing and compliance condition is closed.'}</p></div>${foot(2)}</section>`);
pages.push(`<section class="report-page">${head(3,'Fit Analysis','A readable comparison of the business profile against the actual contract evidence.',meta)}<h2 class="section-label">Opportunity overview</h2>${facts(o,standard)}<h2 class="section-label">Business-to-requirement fit</h2>${capability(a.capability_alignment)}<h2 class="section-label">Eligibility and readiness gates</h2>${eligibility(a)}${foot(3)}</section>`);
pages.push(`<section class="report-page">${head(4,'Risk Assessment','The most consequential pursuit and performance risks, presented as readable decision cards.',meta)}${risks(a.risks)}<div class="callout red"><h3>RISK POSTURE</h3><p>${high?`The assessment identifies ${high} high or critical risk finding${high===1?'':'s'}. Close every displayed risk before authorization.`:'No high-risk item is visible, but unknown and incomplete evidence must still be closed.'}</p></div>${foot(4)}</section>`);
pages.push(`<section class="report-page">${head(5,'Proposal Development Plan','A controlled validation and preparation sequence—not a generic checklist.',meta)}${actionGrid(a.action_plan)}<div class="two-col" style="margin-top:12px"><div class="list-card"><h3>Documents and evidence needed</h3>${list(docs,4)}</div><div class="list-card"><h3>Questions for the buyer</h3>${list(questions,4)}</div></div>${foot(5)}</section>`);
pages.push(`<section class="report-page">${head(6,'Executive Recommendation','The formal management gate and the evidence required to support it.',meta)}${banner(score,rec,readiness)}<div class="callout"><h3>FINAL RECOMMENDATION</h3><p>${esc(a.rationale||'Complete every mandatory validation gate before authorization.')}</p></div><h2 class="section-label">Conditions for authorization</h2>${conditions(a.decision_conditions)}<div class="management"><h3>MANAGEMENT DECISION</h3><div class="choices"><span>☐ APPROVE PURSUIT</span><span>☐ APPROVE WITH CONDITIONS</span><span>☐ DO NOT PURSUE</span></div><div class="signatures"><span>Authorized Executive / Signature</span><span>Date</span><span>Decision Record ID</span></div></div><h2 class="section-label">Source notes and limitations</h2>${list(a.evidence_guardrails,4)}${foot(6)}</section>`);
$('report').innerHTML=pages.join('');$('report').hidden=false;$('status').hidden=true;$('printBtn').disabled=false;$('wordBtn').disabled=false;$('emailBtn').disabled=false;if(d.delivery?.status==='sent')showStatus(`Word report emailed to ${d.delivery.recipient}.`,'good');else setTimeout(()=>emailReport(false),500)}
function showStatus(message,type=''){const el=$('status');el.hidden=false;el.className=`status ${type}`;el.textContent=message}
async function emailReport(force){if(!force&&payload?.delivery?.status==='sent')return;const btn=$('emailBtn');if(force){btn.disabled=true;btn.textContent='Sending…'}showStatus(force?'Sending the Word report again…':'Emailing the Word report…');try{const d=await api('/api/analyze-fit-delivery',{method:'POST',body:JSON.stringify({action:'email_report',request_id:requestId,token,force})});payload.delivery=d.delivery;showStatus(`Word report emailed to ${d.delivery.recipient}.`,'good')}catch(e){showStatus(e.message,'error')}finally{if(force){btn.disabled=false;btn.textContent='Email Report Again'}}}
$('printBtn').onclick=()=>print();$('wordBtn').onclick=()=>location.href=`/api/analyze-fit-delivery?mode=docx&request=${encodeURIComponent(requestId)}&token=${encodeURIComponent(token)}`;$('emailBtn').onclick=()=>emailReport(true);
(async()=>{if(!requestId||!token){showStatus('Report link is incomplete.','error');return}try{render(await api(`/api/analyze-fit-delivery?mode=report&request=${encodeURIComponent(requestId)}&token=${encodeURIComponent(token)}`))}catch(e){showStatus(e.message,'error')}})();
</script></body></html>
