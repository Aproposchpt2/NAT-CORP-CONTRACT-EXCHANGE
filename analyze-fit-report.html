<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Analyze Fit Report | NAT-CORP</title>
<style>
:root{--navy:#071a3e;--blue:#103478;--paper:#f3f6fa;--ink:#203047;--muted:#66758a;--line:#d8e1ed;--green:#176c45;--amber:#9b6300;--red:#962f2f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.top{background:linear-gradient(135deg,#071a3e,#103478);color:#fff;padding:24px 0}.toprow{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font:500 22px Georgia,serif}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.white{background:#fff;color:var(--blue)}.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px;margin:22px auto;box-shadow:0 18px 50px rgba(12,35,75,.08)}.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#56709a}.headline{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.headline h1{font:500 clamp(2rem,4vw,3rem)/1.08 Georgia,serif;color:var(--blue);margin:.4rem 0}.badge{padding:8px 11px;border-radius:999px;border:1px solid var(--line);font-weight:900;font-size:.75rem}.badge.PURSUE{background:#e9f7ef;color:var(--green)}.badge.CONDITIONAL{background:#fff6df;color:var(--amber)}.badge.DO_NOT_PURSUE{background:#fff0f0;color:var(--red)}.meta,.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.meta div,.score,.box,.ledger{border:1px solid var(--line);border-radius:10px;padding:14px;background:#f8fafc}.meta small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}.score b{display:block;font:700 28px Georgia,serif;color:var(--blue)}.score span{color:var(--muted);font-size:.8rem}.summary{border-left:4px solid #d5b15a;background:#fff9e9;padding:16px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box h2{font:500 1.1rem Georgia,serif;color:var(--blue);margin:0 0 8px}.box.full{grid-column:1/-1}.box p,.box li{color:#53637a}.ledger{margin:7px 0;background:#fff}.loading{text-align:center;padding:60px}.muted{color:var(--muted)}@media(max-width:760px){.toprow,.headline{align-items:flex-start;flex-direction:column}.meta,.scores,.grid{grid-template-columns:1fr}.box.full{grid-column:auto}}@media print{body{background:#fff}.top{background:#fff;color:#111;padding:0}.top .actions{display:none}.brand{color:#111}.panel{box-shadow:none;border:0;margin:0;padding:0}.wrap{width:100%}.box,.meta div,.score,.ledger{break-inside:avoid;background:#fff}}
</style>
</head>
<body>
<header class="top"><div class="wrap toprow"><div class="brand">NAT-CORP · Analyze Fit Report</div><div class="actions"><a class="btn ghost" href="/opportunity-services">Opportunity Services</a><button class="btn white" id="printBtn" disabled>Print / Save PDF</button><button class="btn white" id="downloadBtn" disabled>Download Report</button></div></div></header>
<main class="wrap"><section class="panel" id="loading"><div class="loading"><strong>Loading Analyze Fit report…</strong></div></section><section class="panel" id="report" hidden><div class="headline"><div><div class="eyebrow">Contract-Specific Executive Assessment</div><h1 id="title"></h1><p class="muted" id="business"></p></div><span class="badge" id="badge"></span></div><div class="meta" id="meta"></div><div class="summary"><h2 id="summaryTitle" style="font-family:Georgia,serif;margin:0 0 8px"></h2><p id="executiveSummary"></p><p id="rationale"></p></div><div class="scores"><div class="score"><b id="score">—</b><span>Analyze Fit score</span></div><div class="score"><b id="recommendation">—</b><span>Pursuit recommendation</span></div><div class="score"><b id="completed">—</b><span>Report completed</span></div><div class="score"><b id="version">—</b><span>Report standard</span></div></div><div class="grid" id="grid"></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),requestId=qs.get('request')||'',token=qs.get('token')||'';
let payload=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
async function api(url){const r=await fetch(url,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function list(items){const v=arr(items).filter(Boolean);return v.length?`<ul>${v.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>`:'<p>Unavailable / not identified in current evidence.</p>'}
function box(title,html,full=false){return `<section class="box ${full?'full':''}"><h2>${esc(title)}</h2>${html}</section>`}
function capability(items){const v=arr(items);return v.length?v.map(x=>`<div class="ledger"><strong>${esc(x.requirement||'Requirement')} · ${esc(x.status||'UNVERIFIED')}</strong><p><b>Business evidence:</b> ${esc(x.business_evidence||'Unavailable')}</p><p>${esc(x.note||'')}</p></div>`).join(''):'<p>No capability alignment records returned.</p>'}
function risks(items){const v=arr(items);return v.length?v.map(x=>`<div class="ledger"><strong>${esc(x.domain||'Risk')} · ${esc(x.level||'INFORMATION')}</strong><p>${esc(x.finding||'')}</p><p><b>Mitigation:</b> ${esc(x.mitigation||'Unavailable')}</p></div>`).join(''):'<p>No risks returned.</p>'}
function render(d){payload=d;const a=d.run?.analysis||{},o=d.opportunity||{},b=d.business||{};$('title').textContent=o.title||'Selected Contract';$('business').textContent=`Business: ${b.business_name||'Business'}`;$('badge').textContent=d.run?.recommendation||'UNAVAILABLE';$('badge').className=`badge ${d.run?.recommendation||''}`;$('score').textContent=d.run?.score!=null?`${d.run.score}%`:'—';$('recommendation').textContent=(d.run?.recommendation||'—').replaceAll('_',' ');$('completed').textContent=d.run?.completed_at?new Date(d.run.completed_at).toLocaleDateString():'—';$('version').textContent=d.report?.report_version||'NATCORP-OTF-ANALYZE-FIT-v1';$('summaryTitle').textContent=`Recommendation: ${(d.run?.recommendation||'Unavailable').replaceAll('_',' ')}`;$('executiveSummary').textContent=a.executive_summary||'';$('rationale').textContent=a.rationale||'';$('meta').innerHTML=[['Issuing organization',o.issuing_organization||o.issuing_department],['State',o.state_code],['Deadline',o.response_deadline?new Date(o.response_deadline).toLocaleString():'Unavailable'],['Record',o.pdas_record_id||o.id]].map(x=>`<div><small>${esc(x[0])}</small><strong>${esc(x[1]||'Unavailable')}</strong></div>`).join('');$('grid').innerHTML=[box('Contract Requirements',list(a.contract_requirements)),box('Geographic Alignment',`<p>${esc(a.geographic_alignment||'Unavailable')}</p>`),box('Capability Alignment',capability(a.capability_alignment),true),box('Licensing / Qualification Review',list(a.licensing_qualification_review)),box('Capacity / Delivery Review',list(a.capacity_delivery_review)),box('Past Performance Review',list(a.past_performance_review)),box('Risk Register',risks(a.risks),true),box('Unavailable Contract Details',list(a.unavailable_contract_details)),box('Unavailable Business Details',list(a.unavailable_business_details)),box('Decision Conditions',list(a.decision_conditions)),box('Action Plan',list(a.action_plan)),box('Proposal Readiness',`<p>${esc(a.proposal_readiness||'Unavailable')}</p>`,true)].join('');$('loading').hidden=true;$('report').hidden=false;$('printBtn').disabled=false;$('downloadBtn').disabled=false}
function downloadableHtml(){const title=payload?.opportunity?.title||'Analyze Fit Report';const report=document.getElementById('report').innerHTML;return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;color:#203047;line-height:1.5}.badge{font-weight:bold}.meta,.scores,.grid{display:block}.meta div,.score,.box,.ledger{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}.eyebrow{font-size:12px;text-transform:uppercase;color:#56709a}.actions{display:none}</style></head><body>${report}</body></html>`}
$('printBtn').onclick=()=>print();$('downloadBtn').onclick=()=>{if(!payload)return;const blob=new Blob([downloadableHtml()],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=payload.report?.file_name||'NAT-CORP-Analyze-Fit-Report.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)};
(async()=>{if(!requestId||!token){$('loading').innerHTML='<div class="loading"><strong>Report link is incomplete.</strong></div>';return}try{render(await api(`/api/analyze-fit-service?mode=report&request=${encodeURIComponent(requestId)}&token=${encodeURIComponent(token)}`))}catch(e){$('loading').innerHTML=`<div class="loading"><strong>Analyze Fit report could not be loaded.</strong><p>${esc(e.message)}</p></div>`}})();
</script>
</body>
</html>
