<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Executive Procurement Intelligence Engine | Opportunity-to-Fulfillment</title>
<style>
html,body{margin:0;min-height:100%;background:#eef2f7;color:#16253b;font-family:Arial,sans-serif}
#loading{max-width:760px;margin:80px auto;padding:28px;background:#fff;border:1px solid #d8e0eb;border-radius:14px;box-shadow:0 14px 40px rgba(21,44,83,.09);text-align:center}
#loading h1{font:500 25px Georgia,serif;color:#0f2a6a}
#loading.error{border-color:#e3a5a5;background:#fff0f0;color:#792323}
</style>
</head>
<body>
<div id="loading"><h1>Opening Opportunity-to-Fulfillment</h1><p>Loading the executive operator interface…</p></div>
<script>
(async()=>{
  const loading=document.getElementById('loading');
  try{
    const response=await fetch('/opportunity-fulfillment.html',{cache:'no-store',headers:{accept:'text/html'}});
    if(!response.ok)throw new Error('Static operator interface returned HTTP '+response.status+'.');
    let html=await response.text();
    const presentation=`
<style id="otfSimplifiedPresentation">
.queue-check{display:none!important}
.queue-controls{grid-template-columns:minmax(220px,1fr) minmax(160px,.7fr) auto!important}
.hero{grid-template-columns:1fr!important}
.hero>div.panel:nth-child(2){display:none!important}
#taskStatus,#workflow{display:none!important}
.grid{grid-template-columns:1fr!important}
.grid>.stack:nth-child(2){display:none!important}
.otf-batch-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
.otf-batch-nav button{border:1px solid #d8e0eb;border-radius:8px;padding:10px 13px;background:#eef2f7;color:#24354e;font-weight:800;cursor:pointer}
.otf-batch-nav button.primary{background:#0f2a6a;color:#fff;border-color:#0f2a6a}
.otf-batch-nav button:disabled{opacity:.45;cursor:not-allowed}
.otf-batch-label{font-size:11px;color:#65758b;font-weight:700}
@media(max-width:650px){.otf-batch-nav button{width:100%}.otf-batch-label{width:100%;text-align:center}}
</style>
<script id="otfSimplifiedController">
(()=>{
 let queuePage=1,queueMeta=null;
 function updateBatchControls(){
  const prev=document.getElementById('otfPreviousBatch'),next=document.getElementById('otfNextBatch'),label=document.getElementById('otfBatchLabel'),meta=document.getElementById('queueMeta');
  if(!prev||!next||!label)return;
  prev.disabled=!queueMeta?.has_previous;next.disabled=!queueMeta?.has_next;
  label.textContent=queueMeta?'Showing '+(queueMeta.range_start||0)+'–'+(queueMeta.range_end||0)+' of '+(queueMeta.total||0)+' · Batch '+(queueMeta.page||1)+' of '+(queueMeta.total_pages||1):'Batch 1';
  if(meta&&queueMeta)meta.textContent=label.textContent;
 }
 async function loadPagedQueue(){
  if(!authenticated)return;
  const state=$('queueState').value,mode=$('queueMode').value;
  const q=new URLSearchParams({mode,state,page:String(queuePage),page_size:'30'});
  $('reloadQueue').disabled=true;$('opps').disabled=true;clearVar();
  try{
   const d=await request(queueApi+'?'+q.toString());
   queueMeta=d.queue||null;queuePage=Number(queueMeta?.page||queuePage);opps=d.opportunities||[];
   $('opps').innerHTML='<option value="">Select an actionable open contract…</option>'+opps.map(o=>'<option value="'+o.id+'">'+esc(o.state_code)+' · '+esc(o.title)+'</option>').join('');
   $('opps').disabled=false;ctx=null;render();showReadyState();updateBatchControls();
   setControl((queueMeta?.range_start||0)+'–'+(queueMeta?.range_end||0)+' of '+(queueMeta?.total||0)+' actionable contracts loaded. Choose one, then click 1 · Select Contract.');
  }catch(e){showVar(e.message);$('queueMeta').textContent='Queue load failed.'}
  finally{$('reloadQueue').disabled=false}
 }
 function install(){
  const meta=document.getElementById('queueMeta');
  if(meta&&!document.getElementById('otfBatchNav')){
   const nav=document.createElement('div');nav.id='otfBatchNav';nav.className='otf-batch-nav';
   nav.innerHTML='<button id="otfPreviousBatch" type="button" disabled>Previous Batch</button><button id="otfNextBatch" type="button" class="primary" disabled>Choose Next Batch</button><span id="otfBatchLabel" class="otf-batch-label">Batch 1</span>';
   meta.insertAdjacentElement('afterend',nav);
   $('otfPreviousBatch').onclick=async()=>{if(!queueMeta?.has_previous)return;queuePage=Math.max(1,queuePage-1);await loadPagedQueue();window.scrollTo({top:0,behavior:'smooth'})};
   $('otfNextBatch').onclick=async()=>{if(!queueMeta?.has_next)return;queuePage+=1;await loadPagedQueue();window.scrollTo({top:0,behavior:'smooth'})};
  }
  $('reloadQueue').onclick=()=>{queuePage=1;loadPagedQueue()};
  for(const id of ['queueMode','queueState'])$(id).onchange=()=>{if(authenticated){queuePage=1;loadPagedQueue()}};
  const originalConnect=connect;
  connect=async function(){await originalConnect();if(authenticated){queuePage=1;await loadPagedQueue()}};
  if(authenticated)loadPagedQueue();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
<\/script>`;
    html=html.replace('</head>',presentation+'</head>');
    document.open();document.write(html);document.close();
  }catch(error){loading.className='error';loading.innerHTML='<h1>Opportunity-to-Fulfillment unavailable</h1><p>'+String(error.message||error)+'</p>'}
})();
</script>
</body>
</html>
